<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" },
      { id: "07-TP-003", name: "Lê Hoàng Long", birthYear: "2007", classUnit: "TP", email: "long.le@example.com", eligible: false, feeStatus: "unregistered", regTime: "-" }
    ];

    const INITIAL_EXAMS = [
      { 
        id: "EXAM-2026-01", 
        name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", 
        passCode: "HSA2026", 
        startTime: "2026-10-25 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 150,
        matrix: { b: 25, h: 30, vd: 30, vdc: 15 },
        active: true 
      }
    ];

    const INITIAL_QUESTIONS = [
      {
        id: "T10-01-01",
        subject: "Toán",
        topic: "Hàm số & Xử lý đồ thị",
        level: "H",
        part: "math",
        content: "Cho hàm số bậc hai y = ax² + bx + c có đồ thị như hình vẽ bên. Đỉnh parabol có tọa độ (1; -4) và cắt trục tung tại điểm (0; -3). Tìm giá trị biểu thức P = a + b + c.",
        hasImage: true,
        imageCode: "T10-01-01.png",
        options: ["P = -3", "P = -4", "P = 2", "P = 0"],
        correctIndex: 1,
        solution: "Đồ thị có đỉnh I(1; -4) => -b/(2a) = 1 <=> b = -2a. Đồ thị cắt trục Oy tại (0; -3) => c = -3. Đi qua đỉnh I(1; -4) => a(1)² + b(1) + c = -4 <=> a + b + c = -4. Vậy P = -4."
      },
      {
        id: "V10-01-02",
        subject: "Văn",
        topic: "Đọc hiểu văn bản thông tin",
        level: "B",
        part: "reading",
        content: "Đoạn trích sau nhấn mạnh vai trò gì của trí tuệ nhân tạo đối với tương lai thị trường lao động?",
        hasImage: false,
        options: ["Thay thế hoàn toàn con người trong mọi ngành nghề", "Hỗ trợ tối ưu hóa năng suất và tạo sinh các kỹ năng công việc mới", "Làm giảm sút hoàn toàn cơ hội việc làm của giới trẻ", "Chỉ phục vụ trong lĩnh vực khoa học công nghệ máy tính"],
        correctIndex: 1,
        solution: "Theo định hướng GDPT 2018, AI đóng vai trò như công cụ cộng hưởng năng suất và thúc đẩy phát triển kỹ năng mới."
      },
      {
        id: "L10-01-03",
        subject: "Lý",
        topic: "Động học chất điểm",
        level: "VD",
        part: "elective",
        content: "Một ô tô đang chạy với vận tốc 20 m/s thì người lái hãm phanh, ô tô chuyển động chậm dần đều với gia tốc có độ lớn 2 m/s². Quãng đường ô tô đi được đến khi dừng hẳn là:",
        hasImage: false,
        options: ["100 m", "200 m", "50 m", "400 m"],
        correctIndex: 0,
        solution: "Áp dụng công thức liên hệ v² - v₀² = 2as. Khi dừng hẳn v = 0 => 0 - (20)² = 2.(-2).s => s = 400 / 4 = 100 m."
      },
      {
        id: "E10-01-04",
        subject: "Tiếng Anh",
        topic: "Grammar & Vocabulary",
        level: "H",
        part: "elective",
        content: "If the government ________ more investments in renewable energy, greenhouse emissions would decrease significantly.",
        hasImage: false,
        options: ["makes", "made", "had made", "will make"],
        correctIndex: 1,
        solution: "Câu điều kiện loại 2: If + S + V2/ed, S + would + V-inf."
      }
    ];

    function App() {
      const [view, setView] = useState('student'); // 'student' hoặc 'admin'
      const [adminTab, setAdminTab] = useState('exam_creator'); // 'exam_creator', 'ai_audit', 'students'
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState(INITIAL_EXAMS);
      const [questions, setQuestions] = useState(INITIAL_QUESTIONS);

      // Trạng thái phòng học viên
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [electiveChoice, setElectiveChoice] = useState('english');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      // Modal thanh toán
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      // 1. CHỨC NĂNG TẢI FILE ĐỀ LÊN ĐỂ THẨM ĐỊNH
      const [uploadedFile, setUploadedFile] = useState(null);
      const [uploadingProgress, setUploadingProgress] = useState(0);
      const [selectedSubject, setSelectedSubject] = useState("Toán");
      const [rawQuestionText, setRawQuestionText] = useState("");
      const [analyzingAI, setAnalyzingAI] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      const fileInputRef = useRef(null);

      // 2. CHỨC NĂNG PHÒNG TẠO ĐỀ
      const [newExamName, setNewExamName] = useState("Đợt thi Khảo sát Năng lực HSA Chuẩn");
      const [newExamPasscode, setNewExamPasscode] = useState("HSA2026");
      const [newExamTime, setNewExamTime] = useState("2026-11-01T08:00");
      const [newExamFee, setNewExamFee] = useState("50.000 VNĐ");
      const [matrixB, setMatrixB] = useState(25);
      const [matrixH, setMatrixH] = useState(30);
      const [matrixVD, setMatrixVD] = useState(30);
      const [matrixVDC, setMatrixVDC] = useState(15);
      const [antiRepeat, setAntiRepeat] = useState(true);

      const currentUser = students[currentUserIndex];

      // Đếm ngược thời gian thi
      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      // Chống chuyển tab
      useEffect(() => {
        if (studentMode !== 'exam') return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const nextCount = c + 1;
              if (nextCount >= 3) {
                alert("CẢNH BÁO VI PHẠM: Bạn đã rời màn hình thi quá 3 lần! Hệ thống tự động thu bài.");
                handleSubmitExam();
              }
              return nextCount;
            });
          }
        };

        const handleBlur = () => setExamViolationCount(c => c + 1);

        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // Xử lý khi chọn file đề (Word/PDF/Ảnh)
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploadedFile(file);
        setUploadingProgress(20);

        const interval = setInterval(() => {
          setUploadingProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              // Mô phỏng trích xuất OCR câu hỏi và đồ thị từ file
              setRawQuestionText(`[Trích xuất tự động từ file ${file.name}]: Cho hàm số f(x) liên tục trên R có đồ thị hoặc bảng biến thiên kèm theo. Tìm tất cả các giá trị thực của tham số m để phương trình f(x) = m có đúng 3 nghiệm phân biệt.`);
              return 100;
            }
            return prev + 40;
          });
        }, 300);
      };

      // Kích hoạt AI Thẩm định câu hỏi
      const handleRunAiAudit = () => {
        if (!rawQuestionText.trim()) {
          alert("Vui lòng tải tệp đề lên hoặc dán nội dung câu hỏi!");
          return;
        }

        setAnalyzingAI(true);
        setTimeout(() => {
          const generatedId = `T10-02-${Math.floor(10 + Math.random() * 89)}`;
          const result = {
            id: generatedId,
            subject: selectedSubject,
            topic: "Hàm số & Phương trình tương giao (CT GDPT 2018)",
            level: "VD",
            content: rawQuestionText,
            imageCode: `${generatedId}.png`,
            options: ["m ∈ (-2; 4)", "m ∈ [-2; 4]", "m ∈ (0; +∞)", "m < -2"],
            correctIndex: 0,
            solution: "Phân tích bảng biến thiên trích xuất: Đường thẳng y = m cắt đồ thị tại 3 điểm phân biệt khi và chỉ khi giá trị cực tiểu < m < giá trị cực đại <=> -2 < m < 4.",
            variants: [
              { id: `${generatedId}1`, content: `[Phái sinh 1 - Cùng chuyên đề]: Tìm m để phương trình f(x) = 2m - 1 có đúng 2 nghiệm.`, options: ["m = 1", "m = 2.5", "m = 0", "m = -1"], correctIndex: 1 },
              { id: `${generatedId}2`, content: `[Phái sinh 2 - Cùng chuyên đề]: Tìm số điểm cực trị của hàm số g(x) = f(x² - 2x).`, options: ["3", "5", "7", "1"], correctIndex: 1 },
              { id: `${generatedId}3`, content: `[Phái sinh 3 - Cùng chuyên đề]: Giá trị lớn nhất của hàm số trên đoạn [-1; 2].`, options: ["4", "6", "2", "-2"], correctIndex: 0 }
            ]
          };
          setAiResult(result);
          setAnalyzingAI(false);
        }, 1200);
      };

      const handleSaveAiQuestion = () => {
        if (!aiResult) return;
        setQuestions([aiResult, ...questions]);
        alert(`Đã thẩm định thành công! Đã tách file đồ thị ${aiResult.imageCode}, lưu câu gốc vào Ngân hàng Đề Gốc và nạp 3 câu phái sinh vào Ngân hàng Luyện Thi.`);
        setAiResult(null);
        setRawQuestionText("");
        setUploadedFile(null);
        setUploadingProgress(0);
      };

      // Xử lý tạo đợt thi mới trong Phòng Tạo Đề
      const handleCreateNewExam = () => {
        if (!newExamName.trim() || !newExamPasscode.trim()) {
          alert("Vui lòng nhập tên đợt thi và mật khẩu đợt thi!");
          return;
        }

        const totalPercent = Number(matrixB) + Number(matrixH) + Number(matrixVD) + Number(matrixVDC);
        if (totalPercent !== 100) {
          alert(`Tổng tỷ lệ ma trận độ khó phải bằng 100%! Hiện tại là: ${totalPercent}%`);
          return;
        }

        const newExam = {
          id: `EXAM-${Date.now().toString().slice(-4)}`,
          name: newExamName,
          passCode: newExamPasscode,
          startTime: newExamTime.replace("T", " "),
          fee: newExamFee,
          totalQuestions: 150,
          matrix: { b: matrixB, h: matrixH, vd: matrixVD, vdc: matrixVDC },
          antiRepeat: antiRepeat,
          active: true
        };

        setExams([newExam, ...exams]);
        alert(`TẠO ĐỢT THI THÀNH CÔNG!\n- Tên: ${newExam.name}\n- Mật khẩu: ${newExam.passCode}\n- Ma trận: ${matrixB}% B, ${matrixH}% H, ${matrixVD}% VD, ${matrixVDC}% VDC\n- Cơ chế: Tự sinh đề theo mã ID thí sinh, lọc chống lặp câu hỏi.`);
      };

      // Đăng ký thi nộp phí
      const handleRegisterExamWithFee = () => {
        const ref = `HSA-${currentUser.id}-${Math.floor(1000 + Math.random() * 9000)}`;
        setPaymentRefCode(ref);
        setShowPaymentModal(true);
      };

      const confirmPaymentSubmission = () => {
        const updated = [...students];
        updated[currentUserIndex] = {
          ...currentUser,
          feeStatus: "pending",
          regTime: new Date().toLocaleString('vi-VN')
        };
        setStudents(updated);
        setShowPaymentModal(false);
        alert(`Đã gửi xác nhận nộp lệ phí! Quản trị viên sẽ kiểm tra và bật điều kiện dự thi cho bạn.`);
      };

      const handleStartExam = () => {
        if (currentUser.feeStatus !== 'approved' || !currentUser.eligible) {
          alert("BẠN CHƯA ĐỦ ĐIỀU KIỆN DỰ THI! Vui lòng nộp lệ phí và chờ Quản trị viên duyệt điều kiện.");
          return;
        }
        if (examPasscode.trim() !== exams[0].passCode) {
          alert(`Mật khẩu đợt thi không chính xác! (Mật khẩu đợt này là: ${exams[0].passCode})`);
          return;
        }

        setCurrentExamQuestions(questions);
        setAnswers({});
        setTimeLeft(75 * 60);
        setExamViolationCount(0);
        setActiveQuestionIdx(0);
        setStudentMode('exam');
      };

      const handleSubmitExam = () => {
        let total = 0;
        currentExamQuestions.forEach((q, idx) => {
          if (answers[idx] === q.correctIndex) total += 1;
        });

        setExamFinishedData({
          total: total,
          questions: currentExamQuestions,
          userAnswers: answers,
          violations: examViolationCount
        });
        setStudentMode('result');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-black text-xl shadow">
                  HSA
                </div>
                <div>
                  <h1 className="font-bold text-lg md:text-xl tracking-tight leading-none">HỆ THỐNG LUYỆN THI ĐÁNH GIÁ NĂNG LỰC</h1>
                  <span className="text-xs text-blue-200">ĐHQGHN • CT GDPT 2018 • Khảo Thí & Thẩm Định Độc Lập</span>
                </div>
              </div>

              {/* Chuyển đổi Phòng Học Viên & Quản Trị */}
              <div className="flex items-center space-x-2">
                <div className="hidden md:flex items-center bg-blue-950/70 px-2 py-1 rounded text-xs">
                  <span className="text-slate-300 mr-2">Đang đóng vai:</span>
                  <select 
                    value={currentUserIndex} 
                    onChange={(e) => setCurrentUserIndex(Number(e.target.value))}
                    className="bg-transparent text-amber-300 font-bold outline-none cursor-pointer"
                  >
                    {students.map((st, i) => (
                      <option key={st.id} value={i} className="text-slate-900">
                        {st.name} ({st.id} - {st.feeStatus === 'approved' ? 'Đã duyệt' : st.feeStatus === 'pending' ? 'Chờ duyệt' : 'Chưa nộp phí'})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex bg-blue-950/80 p-1 rounded-lg border border-blue-700/50">
                  <button
                    onClick={() => { setView('student'); setStudentMode('hub'); }}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'student' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Học Viên
                  </button>
                  <button
                    onClick={() => setView('admin')}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Quản Trị
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {view === 'admin' ? (
              /* ==================== PHÒNG QUẢN TRỊ ==================== */
              <div className="space-y-6">
                {/* Menu chuyển các phân hệ Quản trị */}
                <div className="bg-white p-2 rounded-xl shadow-sm border flex flex-wrap gap-2">
                  <button
                    onClick={() => setAdminTab('exam_creator')}
                    className={`px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition ${adminTab === 'exam_creator' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    🛠️ 1. Phòng Tạo Đợt Thi (Ma trận chuẩn HSA)
                  </button>
                  <button
                    onClick={() => setAdminTab('ai_audit')}
                    className={`px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition ${adminTab === 'ai_audit' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📤 2. Tải Lên File Đề & AI Thẩm Định
                  </button>
                  <button
                    onClick={() => setAdminTab('students')}
                    className={`px-4 py-2 text-xs md:text-sm font-bold rounded-lg transition ${adminTab === 'students' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    👥 3. Quản Lý Học Viên & Duyệt Phí
                  </button>
                </div>

                {/* 1. PHÂN HỆ: PHÒNG TẠO ĐỢT THI */}
                {adminTab === 'exam_creator' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                    <div className="border-b pb-4 flex justify-between items-center">
                      <div>
                        <h2 className="text-lg font-bold text-blue-950">Phòng Tạo Đợt Thi & Cấu Hình Sinh Đề Chuẩn HSA</h2>
                        <p className="text-xs text-slate-500 mt-0.5">Tự động cấu hình 3 phần thi: Toán & Số liệu (50 câu - 75p), Đọc hiểu (50 câu - 60p), Tự chọn (50đ).</p>
                      </div>
                      <span className="text-xs bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full">
                        Chuẩn Khung ĐHQGHN
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {/* Cột trái: Cài đặt thông tin đợt thi */}
                      <div className="space-y-4">
                        <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wider">Thông Tin Đợt Thi</h3>
                        
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Tên đợt thi:</label>
                          <input
                            type="text"
                            value={newExamName}
                            onChange={(e) => setNewExamName(e.target.value)}
                            className="w-full border rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu đợt thi:</label>
                            <input
                              type="text"
                              value={newExamPasscode}
                              onChange={(e) => setNewExamPasscode(e.target.value)}
                              className="w-full border rounded-lg px-3 py-2 text-xs font-mono font-bold text-blue-900 focus:ring-2 focus:ring-blue-600 outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-semibold text-slate-600 mb-1">Lệ phí hỗ trợ thẩm định:</label>
                            <input
                              type="text"
                              value={newExamFee}
                              onChange={(e) => setNewExamFee(e.target.value)}
                              className="w-full border rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-600 outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Thời gian mở đợt thi:</label>
                          <input
                            type="datetime-local"
                            value={newExamTime}
                            onChange={(e) => setNewExamTime(e.target.value)}
                            className="w-full border rounded-lg px-3 py-2 text-xs outline-none"
                          />
                        </div>

                        <div className="p-3 bg-slate-50 border rounded-xl flex items-center justify-between">
                          <div>

                        <p><strong>Lệ phí hỗ trợ thẩm định đề:</strong> <span className="text-rose-600 font-bold text-sm">{exams[0].fee}</span></p>
                      </div>

                      <div className="bg-slate-50 border rounded-xl p-4 flex flex-col items-center justify-center text-center">
                        <div className="w-36 h-36 bg-white border-2 border-slate-300 rounded-lg flex flex-col items-center justify-center shadow-inner">
                          <span className="font-black text-slate-700 text-2xl tracking-tighter">VIETQR</span>
                          <span className="text-[10px] text-slate-400 font-mono mt-1">Mã: {paymentRefCode}</span>
                          <span className="text-xs font-bold text-emerald-600 mt-1">{exams[0].fee}</span>
                        </div>
                        <p className="text-[11px] text-slate-500 mt-2 font-mono">
                          Nội dung CK: <strong className="text-blue-900">{paymentRefCode}</strong>
                        </p>
                      </div>

                      <div className="flex gap-2 pt-2">
                        <button
                          onClick={() => setShowPaymentModal(false)}
                          className="flex-1 py-2 border rounded-xl text-xs font-semibold text-slate-600"
                        >
                          Hủy
                        </button>
                        <button
                          onClick={confirmPaymentSubmission}
                          className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                        >
                          Tôi đã chuyển tiền / Xác nhận
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH LÀM BÀI */}
                {(studentMode === 'exam' || studentMode === 'practice') && (
                  <div className="space-y-4 no-select">
                    {studentMode === 'exam' && examViolationCount > 0 && (
                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center">
                        <span className="font-bold">⚠️ BẠN ĐÃ RỜI MÀN HÌNH {examViolationCount}/3 LẦN! (Quá 3 lần sẽ tự động thu bài).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? "BÀI THI CHÍNH THỨC" : "BÀI LUYỆN TẬP CHUYÊN ĐỀ"}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button
                          onClick={handleSubmitExam}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow"
                        >
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} ({currentExamQuestions[activeQuestionIdx].id})
                              </span>
                              <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                Mức độ: {currentExamQuestions[activeQuestionIdx].level} | {currentExamQuestions[activeQuestionIdx].subject}
                              </span>
                            </div>

                            <p className="text-sm font-medium text-slate-800 leading-relaxed mb-4">
                              {currentExamQuestions[activeQuestionIdx].content}
                            </p>

                            {currentExamQuestions[activeQuestionIdx].hasImage && (
                              <div className="my-3 p-3 bg-slate-50 border rounded-lg text-center">
                                <div className="inline-block bg-white border px-8 py-6 rounded text-xs text-slate-500 font-mono">
                                  [Hình vẽ/Đồ thị chuẩn tách riêng mã: {currentExamQuestions[activeQuestionIdx].imageCode}]
                                </div>
                              </div>
                            )}

                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <span>{opt}</span>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <h4 className="text-xs font-bold text-slate-700 uppercase mb-3">Mục lục câu hỏi</h4>
                        <div className="grid grid-cols-5 gap-2">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH KẾT QUẢ */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="text-center pb-4 border-b">
                      <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI ĐÁNH GIÁ NĂNG LỰC</h2>
                      <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số lần rời màn hình: {examFinishedData.violations}</p>
                      
                      <div className="inline-block mt-4 bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                        <span className="text-xs text-blue-700 font-bold uppercase">Tổng Điểm</span>
                        <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                      </div>
                    </div>

                    <div>
                      <h3 className="text-sm font-bold text-slate-800 mb-3">Lời giải chi tiết từ Chuyên gia thẩm định:</h3>
                      <div className="space-y-3">
                        {examFinishedData.questions.map((q, idx) => {
                          const userAns = examFinishedData.userAnswers[idx];
                          const isCorrect = userAns === q.correctIndex;
                          return (
                            <div key={idx} className={`p-4 rounded-xl border text-xs ${isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-rose-200 bg-rose-50/20'}`}>
                              <div className="flex justify-between font-bold mb-1">
                                <span>Câu {idx + 1} ({q.id}) - {q.subject}</span>
                                <span className={isCorrect ? 'text-emerald-700' : 'text-rose-700'}>
                                  {isCorrect ? "✓ Đúng" : "✗ Sai"}
                                </span>
                              </div>
                              <p className="text-slate-700 mb-2">{q.content}</p>
                              <div className="bg-white p-2.5 rounded-lg border text-slate-800">
                                <p className="font-bold text-emerald-700">Đáp án: {String.fromCharCode(65 + q.correctIndex)}. {q.options[q.correctIndex]}</p>
                                <p className="text-blue-900 mt-1">💡 Lời giải: {q.solution}</p>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <button
                      onClick={() => setStudentMode('hub')}
                      className="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs"
                    >
                      Trở về Bảng Điều Khiển Học Viên
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
