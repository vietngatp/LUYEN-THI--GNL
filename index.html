  <script type="text/babel">

    const SAMPLE_SVG_VARIATION = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='460' height='160' viewBox='0 0 460 160'><rect width='460' height='160' fill='%23ffffff' stroke='%23334155' stroke-width='2'/><line x1='60' y1='0' x2='60' y2='160' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='40' x2='460' y2='40' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='80' x2='460' y2='80' stroke='%23334155' stroke-width='1.5'/><text x='25' y='26' font-family='Times New Roman' font-size='15' font-weight='bold'>x</text><text x='15' y='65' font-family='Times New Roman' font-size='15' font-weight='bold'>f'(x)</text><text x='15' y='125' font-family='Times New Roman' font-size='15' font-weight='bold'>f(x)</text><text x='80' y='26' font-size='14' font-family='Times New Roman'>-∞</text><text x='180' y='26' font-size='14' font-family='Times New Roman'>-1</text><text x='280' y='26' font-size='14' font-family='Times New Roman'>1</text><text x='390' y='26' font-size='14' font-family='Times New Roman'>+∞</text><text x='130' y='65' font-size='15' fill='%2310b981' font-weight='bold'>+</text><text x='180' y='65' font-size='15'>0</text><text x='230' y='65' font-size='15' fill='%23ef4444' font-weight='bold'>-</text><text x='280' y='65' font-size='14'>0</text><text x='330' y='65' font-size='15' fill='%2310b981' font-weight='bold'>+</text><text x='80' y='145' font-size='13' font-family='Times New Roman'>-∞</text><text x='180' y='95' font-size='14' font-weight='bold' fill='%23059669' font-family='Times New Roman'>2</text><text x='280' y='145' font-size='14' font-weight='bold' fill='%23ea580c' font-family='Times New Roman'>-2</text><text x='390' y='95' font-size='13' font-family='Times New Roman'>+∞</text><line x1='100' y1='140' x2='170' y2='100' stroke='%2310b981' stroke-width='2'/><line x1='195' y1='100' x2='270' y2='140' stroke='%23ef4444' stroke-width='2'/><line x1='295' y1='140' x2='380' y2='100' stroke='%2310b981' stroke-width='2'/></svg>";

    // CHUẨN HÓA VĂN BẢN VÀ BẢO TỒN FONT TIMES NEW ROMAN
    function cleanAndFixFont(str) {
      if (!str) return "";
      let s = String(str);
      const tcvn = "a\u00B8\u00B5\u00B6\u00B7\u00B9\u00A8\u00CA\u00C7\u00C8\u00C9\u00CB\u00A9\u00D0\u00CC\u00CE\u00CF\u00D1\u00E9\u00E5\u00E6\u00E7\u00E8\u00AA\u00F3\u00EE\u00EF\u00F1\u00F2\u00A1\u00A2\u00A3\u00A4\u00A5\u00A6\u00A7\u00ED\u00EB\u00EC\u00EE\u00EF\u00F3\u00F5\u00F6\u00F7\u00F8\u00F9\u00FA\u00FB\u00FC\u00FD";
      const uni = "àảãáạăằẳẵắặâầẩẫấậèẻẽéẹêềểễếệìỉĩíịòỏõóọôồổỗốộơờởỡớợùủũúụưừửữứựỳỷỹýỵ";
      let res = "";
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        const idx = tcvn.indexOf(c);
        res += (idx !== -1 && idx < uni.length) ? uni[idx] : c;
      }
      try {
        res = res.normalize('NFC');
      } catch (e) {}
      return res;
    }

    // TỰ ĐỘNG CHUYỂN TOÁN TỪ WORD SANG LATEX
    function convertMathSymbolsToLatex(text) {
      if (!text) return "";
      let s = cleanAndFixFont(text);
      s = s.replace(/√\((.*?)\)/g, "$\sqrt{$1}$");
      s = s.replace(/√([a-zA-Z0-9]+)/g, "$\sqrt{$1}$");
      s = s.replace(/²/g, "$^2$").replace(/³/g, "$^3$");
      s = s.replace(/∫/g, "$\int$");
      s = s.replace(/∞/g, "$\infty$").replace(/\+∞/g, "$+\infty$").replace(/-∞/g, "$-\infty$");
      s = s.replace(/∈/g, "$\in$").replace(/∉/g, "$\notin$");
      s = s.replace(/≤/g, "$\le$").replace(/≥/g, "$\ge$").replace(/≠/g, "$\ne$");
      s = s.replace(/→/g, "$\to$").replace(/⇔/g, "$\Leftrightarrow$").replace(/⇒/g, "$\Rightarrow$");
      s = s.replace(/∆/g, "$\Delta$").replace(/π/g, "$\pi$");
      s = s.replace(/R/g, "$\mathbb{R}$");
      return s;
    }

    // RENDER TOÁN KA-TEX AN TOÀN TUYỆT ĐỐI (TRÁNH LỖI ĐƠ TRANG)
    function renderSafeMathHtml(text) {
      if (!text) return "";
      const prepared = convertMathSymbolsToLatex(text);
      const parts = prepared.split(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g);

      return parts.map((part, idx) => {
        if (!part) return null;
        if (part.startsWith("$$") && part.endsWith("$$")) {
          const formula = part.slice(2, -2).trim();
          try {
            if (window.katex) {
              const html = window.katex.renderToString(formula, { displayMode: true, throwOnError: false });
              return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} />;
            }
          } catch (e) {
            return <span key={idx} className="font-bold text-blue-900 block my-1">[{formula}]</span>;
          }
        } else if (part.startsWith("$") && part.endsWith("$")) {
          const formula = part.slice(1, -1).trim();
          try {
            if (window.katex) {
              const html = window.katex.renderToString(formula, { displayMode: false, throwOnError: false });
              return <span key={idx} dangerouslySetInnerHTML={{ __html: html }} />;
            }
          } catch (e) {
            return <span key={idx} className="font-bold text-blue-900">[{formula}]</span>;
          }
        }
        return <span key={idx}>{part}</span>;
      });
    }

    const MathViewer = memo(function MathViewer({ content, imageSrc, imageCode }) {
      const cleanContent = useMemo(() => cleanAndFixFont(content), [content]);

      const hasPlaceholder = cleanContent.includes("[HINH_ANH]");
      let partBefore = cleanContent;
      let partAfter = "";

      if (hasPlaceholder) {
        const parts = cleanContent.split("[HINH_ANH]");
        partBefore = parts[0];
        partAfter = parts[1] || "";
      }

      return (
        <div className="math-text text-sm leading-relaxed text-slate-900 space-y-2">
          {hasPlaceholder ? (
            <div>
              <div className="whitespace-pre-wrap">{renderSafeMathHtml(partBefore)}</div>
              <div className="my-3 flex flex-col items-center justify-center p-3 bg-white border border-slate-200 rounded-xl shadow-sm">
                {imageSrc ? (
                  <img src={imageSrc} alt="Hình vẽ đề bài" className="max-h-64 max-w-full rounded object-contain" />
                ) : (
                  <div className="w-full max-w-md py-6 bg-slate-50 border-2 border-dashed border-blue-300 rounded-lg flex flex-col items-center justify-center text-blue-900">
                    <span className="text-3xl mb-1">📈</span>
                    <span className="font-bold text-xs">[Đồ thị / Bảng biến thiên nằm đúng vị trí]</span>
                    <span className="font-mono text-[11px] text-blue-600 mt-0.5">Mã: {imageCode || "HinhAnh.png"}</span>
                  </div>
                )}
              </div>
              <div className="whitespace-pre-wrap">{renderSafeMathHtml(partAfter)}</div>
            </div>
          ) : (
            <div>
              <div className="whitespace-pre-wrap">{renderSafeMathHtml(cleanContent)}</div>
              {(imageSrc || imageCode) && (
                <div className="my-3 flex flex-col items-center justify-center p-3 bg-white border border-slate-200 rounded-xl shadow-sm">
                  {imageSrc ? (
                    <img src={imageSrc} alt="Hình vẽ đề bài" className="max-h-64 max-w-full rounded object-contain" />
                  ) : (
                    <div className="w-full max-w-md py-6 bg-slate-50 border-2 border-dashed border-blue-300 rounded-lg flex flex-col items-center justify-center text-blue-900">
                      <span className="text-3xl mb-1">📈</span>
                      <span className="font-bold text-xs">[Đồ thị / Bảng biến thiên nằm đúng vị trí]</span>
                      <span className="font-mono text-[11px] text-blue-600 mt-0.5">Mã: {imageCode}</span>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    });

    const MathSpan = memo(function MathSpan({ text }) {
      return <span className="inline math-text">{renderSafeMathHtml(text)}</span>;
    });

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" },
      { id: "07-TP-003", name: "Lê Hoàng Long", birthYear: "2007", classUnit: "TP", email: "long.le@example.com", eligible: false, feeStatus: "unregistered", regTime: "-" }
    ];

    const generateRootMathQuestions = () => {
      const list = [];
      const topics = [
        "Hàm số & Ứng dụng đạo hàm",
        "Hàm số Mũ - Logarit",
        "Nguyên hàm - Tích phân",
        "Tọa độ Oxyz trong không gian",
        "Thống kê mẫu số liệu & Xác suất",
        "Hình học không gian"
      ];

      for (let i = 1; i <= 50; i++) {
        const numStr = i < 10 ? '0' + i : '' + i;
        const code = `T01-${numStr}`;
        const hasImg = (i % 3 === 1);
        const lvl = i <= 13 ? "B" : (i <= 28 ? "H" : (i <= 43 ? "VD" : "VDC"));
        const topic = topics[(i - 1) % topics.length];

        let content = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          content = `Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên như hình vẽ bên dưới:[HINH_ANH]Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [`$m \in (-1; 1)$`, `$m \in [-2; 2]$`, `$m < -1$ hoặc $m > 1$`, `$m = 0$`];
          sol = `Phương trình tương đương $f(x) = 2m$. Dựa vào bảng biến thiên trên hình vẽ, phương trình có 3 nghiệm phân biệt khi cực tiểu < 2m < cực đại <=> -2 < 2m < 2 <=> -1 < m < 1. Chọn đáp án A.`;
        } else if (i % 3 === 2) {
          content = `Biết tích phân $I = \int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và $\frac{a}{c}$ tối giản. Giá trị biểu thức $S = a + b + c$ bằng:`;
          opts = [`$S = 9$`, `$S = 12$`, `$S = 15$`, `$S = 7$`];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow 2t dt = \frac{dx}{x}$. Ta tính được $I = \frac{4 - 2\sqrt{2}}{3}$. Suy ra $a = 4, b = 2, c = 3 \Rightarrow S = 4 + 2 + 3 = 9$.`;
        } else {
          content = `Trong không gian $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của $(S)$ đến $(P)$ là:`;
          opts = [`$d = \frac{13}{3}$`, `$d = 5$`, `$d = 3$`, `$d = \sqrt{29}$`];
          sol = `Tâm mặt cầu $I(1; -2; 3)$. Áp dụng công thức khoảng cách: $d(I, (P)) = \frac{|2(1) - 2(-2) + 1(3) + 4|}{\sqrt{2^2 + (-2)^2 + 1^2}} = \frac{13}{3}$.`;
        }

        list.push({
          id: code,
          subjectCode: "T",
          subjectName: "Toán",
          topic: topic,
          level: lvl,
          content: content,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : "",
          imageSrc: hasImg ? SAMPLE_SVG_VARIATION : null,
          options: opts,
          correctIndex: 0,
          solution: sol
        });
      }
      return list;
    };

    const generateInitialPractice = (roots) => {
      const pList = [];
      roots.slice(0, 15).forEach(q => {
        for (let k = 1; k <= 3; k++) {
          pList.push({
            id: `${q.id}${k}`,
            rootId: q.id,
            subjectCode: q.subjectCode,
            subjectName: q.subjectName,
            topic: q.topic,
            level: q.level,
            content: `Biến thể câu hỏi ${k} cùng chuyên đề: ${q.content.replace("Cho hàm số bậc ba", "Cho hàm đa thức bậc ba").replace("Biết tích phân", "Tính tích phân")}`,
            hasImage: q.hasImage,
            imageCode: q.imageCode,
            imageSrc: q.imageSrc,
            options: q.options,
            correctIndex: (q.correctIndex + k) % 4,
            solution: `Lời giải thẩm định chi tiết cho câu luyện tập ${q.id}${k}.`
          });
        }
      });
      return pList;
    };

    const INITIAL_ROOT_QUESTIONS = generateRootMathQuestions();
    const INITIAL_PRACTICE_QUESTIONS = generateInitialPractice(INITIAL_ROOT_QUESTIONS);

    function App() {
      const [view, setView] = useState('student');
      const [adminTab, setAdminTab] = useState('audit');
      const [currentUserIndex, setCurrentUserIndex] = useState(0);

      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [rootQuestions, setRootQuestions] = useState(INITIAL_ROOT_QUESTIONS);
      const [practiceQuestions, setPracticeQuestions] = useState(INITIAL_PRACTICE_QUESTIONS);
      const [exams, setExams] = useState([
        { id: "EXAM-2026-01", name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", passCode: "HSA2026", startTime: "2026-10-25 08:00", fee: "50.000 VNĐ", totalQuestions: 150 }
      ]);

      const [bankSubjectFilter, setBankSubjectFilter] = useState("Tất cả");

      const [auditSubjectCode, setAuditSubjectCode] = useState("T");
      const [auditExamCode, setAuditExamCode] = useState("01");
      const [rawQuestionInput, setRawQuestionInput] = useState("");
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [analyzingAI, setAnalyzingAI] = useState(false);
      const [aiAuditedResult, setAiAuditedResult] = useState(null);

      // Ảnh bóc tách từ file Word
      const [extractedWordImages, setExtractedWordImages] = useState([]);

      const [showConfirmAddModal, setShowConfirmAddModal] = useState(false);

      const [editingQuestion, setEditingQuestion] = useState(null);
      const [editingModalOpen, setEditingModalOpen] = useState(false);

      const [newExamName, setNewExamName] = useState("Đợt thi Khảo sát HSA Chuẩn 2026");
      const [newExamPasscode, setNewExamPasscode] = useState("HSA2026");
      const [newExamTime, setNewExamTime] = useState("2026-11-01T08:00");
      const [newExamFee, setNewExamFee] = useState("50.000 VNĐ");

      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [electiveChoice, setElectiveChoice] = useState('english');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [currentExamPart, setCurrentExamPart] = useState(1);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      const currentUser = students[currentUserIndex];

      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode.startsWith('practice')) && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitCurrentExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      useEffect(() => {
        if (studentMode !== 'exam') return;

        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const next = c + 1;
              if (next >= 3) {
                alert("CẢNH BÁO VI PHẠM NỘI QUI: Bạn đã rời khỏi màn hình thi quá 3 lần! Hệ thống tự động khóa và thu bài thi.");
                handleSubmitCurrentExam();
              }
              return next;
            });
          }
        };

        const handleBlur = () => setExamViolationCount(c => c + 1);

        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);

        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // XỬ LÝ ĐỌC FILE AN TOÀN TUYỆT ĐỐI (KHÔNG BAO GIỜ BỊ ĐƠ HAY HIỆN MÃ RÁC)
      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const codeInput = window.prompt("Vui lòng nhập Mã Đề cần nạp (Ví dụ: 01, 02, 05):", auditExamCode);
        const code = codeInput && codeInput.trim() !== "" ? codeInput.trim() : auditExamCode;
        setAuditExamCode(code);
        setUploadedFileName(file.name);

        const lowerName = file.name.toLowerCase();

        // 1. FILE WORD (.DOCX) - ĐỌC QUA JSZIP DẠNG ARRAYBUFFER
        if (lowerName.endsWith(".docx")) {
          try {
            const arrayBuffer = await file.arrayBuffer();
            const zip = await JSZip.loadAsync(arrayBuffer);

            // Bóc tách hình ảnh từ word/media/
            const images = [];
            const mediaFiles = Object.keys(zip.files).filter(path => path.startsWith("word/media/"));
            for (const path of mediaFiles) {
              const base64 = await zip.files[path].async("base64");
              const ext = path.split('.').pop().toLowerCase();
              const mime = (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : 'image/png';
              images.push(`data:${mime};base64,${base64}`);
            }
            setExtractedWordImages(images);

            // Bóc tách văn bản và công thức từ word/document.xml
            if (zip.files["word/document.xml"]) {
              const xmlText = await zip.files["word/document.xml"].async("text");
              const parser = new DOMParser();
              const xmlDoc = parser.parseFromString(xmlText, "text/xml");

              const paragraphs = xmlDoc.getElementsByTagName("w:p");
              let lines = [];

              for (let i = 0; i < paragraphs.length; i++) {
                const p = paragraphs[i];
                let lineText = "";
                let hasImg = p.getElementsByTagName("w:drawing").length > 0;

                for (const node of p.childNodes) {
                  if (node.nodeName === "w:r") {
                    const texts = node.getElementsByTagName("w:t");
                    for (let t = 0; t < texts.length; t++) {
                      lineText += texts[t].textContent;
                    }
                  } else if (node.nodeName === "m:oMath" || node.nodeName === "m:oMathPara") {
                    const mTexts = node.getElementsByTagName("m:t");
                    let mathExpr = "";
                    for (let m = 0; m < mTexts.length; m++) {
                      mathExpr += mTexts[m].textContent;
                    }
                    if (mathExpr.trim()) {
                      lineText += " $" + mathExpr.trim() + "$ ";
                    }
                  }
                }

                if (hasImg) {
                  lineText += " [HINH_ANH] ";
                }

                if (lineText.trim()) {
                  lines.push(lineText.trim());
                }
              }

              const extractedText = cleanAndFixFont(lines.join("
"));
              setRawQuestionInput(extractedText);
              alert(`Đã nạp file Word ${file.name}! Bóc tách được văn bản, công thức toán và ${images.length} hình ảnh.`);
            }
          } catch (err) {
            console.error("Lỗi đọc docx:", err);
            alert("Không thể giải nén tệp docx. Vui lòng mở Word copy nội dung và dán vào ô bên dưới!");
          }
        } 
        // 2. FILE TEXT THUẦN (.TXT, .TEX)
        else if (lowerName.endsWith(".txt") || lowerName.endsWith(".tex")) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setRawQuestionInput(cleanAndFixFont(event.target.result));

                                setTimeLeft(75 * 60);
                                setActiveQuestionIdx(0);
                                setStudentMode('practice_part');
                              }}
                              className="w-full text-left p-2.5 rounded-xl border border-slate-200 hover:border-indigo-500 text-xs font-semibold flex justify-between items-center bg-slate-50"
                            >
                              <span>• Luyện tập theo phần: Toán & Số liệu (50 câu)</span>
                              <span className="text-indigo-600 font-bold">Vào làm →</span>
                            </button>
                          </div>
                        </div>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border-2 border-blue-600/30 shadow-sm flex flex-col justify-between space-y-4">
                        <div>
                          <div className="w-12 h-12 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center font-black text-2xl mb-3">🎓</div>
                          <h3 className="text-base font-bold text-slate-900 mb-1">2. Phòng Thi Chính Thức ({exams[0]?.name})</h3>
                          <p className="text-xs text-slate-500 mb-3 leading-relaxed">
                            Yêu cầu nhập mật khẩu đợt thi và phải được bật đủ điều kiện dự thi. Hệ thống kiểm soát cảnh báo chống rời màn hình.
                          </p>

                          <div className="space-y-2.5 bg-slate-50 p-3 rounded-xl border mb-2">
                            <div>
                              <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Mật khẩu đợt thi:</label>
                              <input
                                type="password"
                                placeholder={`Nhập ${exams[0]?.passCode}...`}
                                value={examPasscode}
                                onChange={(e) => setExamPasscode(e.target.value)}
                                className="w-full border rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                              />
                            </div>

                            <div>
                              <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Môn thi phần Lựa chọn:</label>
                              <select
                                value={electiveChoice}
                                onChange={(e) => setElectiveChoice(e.target.value)}
                                className="w-full border rounded-lg px-3 py-1.5 text-xs outline-none bg-white font-semibold"
                              >
                                <option value="english">Môn Tiếng Anh (60 phút - 50 câu)</option>
                                <option value="combo">Tổ hợp 3 môn KHTN / KHXH (Lý - Hóa - Sinh)</option>
                              </select>
                            </div>
                          </div>
                        </div>

                        <button
                          onClick={handleStartOfficialExam}
                          className={`w-full py-3 rounded-xl font-bold text-xs transition shadow-md ${currentUser.eligible && currentUser.feeStatus === 'approved' ? 'bg-blue-700 hover:bg-blue-800 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                        >
                          {currentUser.eligible && currentUser.feeStatus === 'approved' ? "Vào Phòng Thi Khảo Sát (Chuẩn HSA)" : "Chưa đủ điều kiện (Cần nộp phí & duyệt)"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODAL NỘP PHÍ */}
                {showPaymentModal && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
                      <div className="flex justify-between items-center border-b pb-3">
                        <h3 className="font-bold text-base text-slate-900">Đăng Ký Thi & Nộp Lệ Phí Thẩm Định</h3>
                        <button onClick={() => setShowPaymentModal(false)} className="text-slate-400 font-bold">✕</button>
                      </div>
                      <div className="text-xs space-y-1 text-slate-600">
                        <p>Thí sinh: <strong>{currentUser.name}</strong> ({currentUser.id})</p>
                        <p>Lệ phí hỗ trợ chuyên gia ra đề & thẩm định: <strong className="text-rose-600 font-bold text-sm">{exams[0]?.fee}</strong></p>
                      </div>
                      <div className="bg-slate-50 border rounded-xl p-4 text-center">
                        <div className="w-32 h-32 bg-white border-2 border-slate-300 rounded mx-auto flex items-center justify-center font-black text-xl">VIETQR</div>
                        <p className="text-[11px] text-slate-500 mt-2 font-mono">Nội dung CK: <strong className="text-blue-900">{paymentRefCode}</strong></p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setShowPaymentModal(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Hủy</button>
                        <button onClick={handleConfirmPayment} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow">
                          Xác Nhận Đã Chuyển Tiền
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH THI & LUYỆN TẬP */}
                {(studentMode === 'exam' || studentMode.startsWith('practice')) && (
                  <div className="space-y-4 no-select">
                    {studentMode === 'exam' && examViolationCount > 0 && (
                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center shadow-sm">
                        <span className="font-bold">⚠️ CẢNH BÁO GIÁM SÁT: Bạn đã rời khỏi màn hình thi {examViolationCount}/3 lần! (Quá 3 lần bài thi tự động thu).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? `ĐỢT THI CHÍNH THỨC HSA (PHẦN ${currentExamPart}/3)` : "BÀI LUYỆN TẬP"}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">
                          {currentExamPart === 1 ? "Phần 1: Toán học & Xử lý số liệu (50 câu - 75 phút)" : (currentExamPart === 2 ? "Phần 2: Ngữ văn - Đọc hiểu (50 câu - 60 phút)" : "Phần 3: Phần tự chọn (50 điểm)")}
                        </h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian còn lại</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button onClick={handleSubmitCurrentExam} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow">
                          {currentExamPart < 3 && studentMode === 'exam' ? "Nộp & Chuyển Phần Tiếp" : "Nộp Bài Thi"}
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} (Mã: {currentExamQuestions[activeQuestionIdx].id})
                              </span>
                              <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                {currentExamQuestions[activeQuestionIdx].topic || "Trọng tâm GDPT 2018"}
                              </span>
                            </div>

                            <div className="mb-4">
                              <MathViewer
                                content={currentExamQuestions[activeQuestionIdx].content}
                                imageSrc={currentExamQuestions[activeQuestionIdx].imageSrc}
                                imageCode={currentExamQuestions[activeQuestionIdx].imageCode}
                              />
                            </div>

                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <MathSpan text={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold text-slate-700 uppercase">Mục lục ({currentExamQuestions.length} câu)</h4>
                          <span className="text-[11px] font-bold text-blue-700 font-mono">
                            {Object.keys(answers).length}/{currentExamQuestions.length}
                          </span>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH KẾT QUẢ */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 text-center">
                    <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI ĐÁNH GIÁ NĂNG LỰC</h2>
                    <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số vi phạm rời màn hình: {examFinishedData.violations}</p>

                    <div className="inline-block bg-blue-50 border border-blue-200 px-8 py-4 rounded-2xl">
                      <span className="text-xs text-blue-700 font-bold uppercase">Tổng Điểm Quy Đổi HSA (Thang 150)</span>
                      <div className="text-4xl font-black text-blue-950 mt-1">{examFinishedData.total} / 150</div>
                    </div>

                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl text-xs text-left space-y-1.5 max-w-xl mx-auto">
                      <h4 className="font-bold text-amber-900">📧 Thông báo gửi về email ({currentUser.email}):</h4>
                      <p className="text-amber-800">• Điểm thành phần: Toán ({examFinishedData.scoreMath}đ) - Đọc hiểu ({examFinishedData.scoreReading}đ) - Tự chọn ({examFinishedData.scoreElective}đ).</p>
                      <p className="text-amber-800">• <strong>Đánh giá tiến độ:</strong> Thí sinh có tiến bộ vượt bậc ở kỹ năng tư duy định lượng. Cần rèn luyện thêm ở chuyên đề <em>"Hàm số & Khảo sát đồ thị"</em> để cải thiện điểm số cho đợt thi tiếp theo.</p>
                      <p className="text-amber-800">• Chúc mừng em và hãy tiếp tục rèn luyện qua app!</p>
                    </div>

                    <div>
                      <button onClick={() => setStudentMode('hub')} className="px-6 py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs shadow-md">
                        Trở về Bảng Điều Khiển Học Viên
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
