<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
    .katex { font-size: 1.08em; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Component hiển thị KaTeX & Hình ảnh dán đúng vị trí
    function FormattedQuestionContent({ content, imageSrc, imageCode }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\[", right: "\\]", display: true },
                { left: "\\(", right: "\\)", display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }
      }, [content]);

      const hasPlaceholder = content && content.includes("[HINH_ANH]");
      let partBefore = content;
      let partAfter = "";

      if (hasPlaceholder) {
        const parts = content.split("[HINH_ANH]");
        partBefore = parts[0];
        partAfter = parts[1] || "";
      }

      return (
        <div ref={containerRef} className="text-sm font-medium text-slate-900 leading-relaxed space-y-3">
          {hasPlaceholder ? (
            <div>
              <span className="whitespace-pre-wrap">{partBefore}</span>
              <div className="my-3 flex flex-col items-center justify-center p-2 bg-slate-50 border rounded-xl">
                {imageSrc ? (
                  <img src={imageSrc} alt="Hình vẽ đề bài" className="max-h-60 max-w-full rounded-lg object-contain shadow-sm" />
                ) : (
                  <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                    <span className="text-3xl mb-1">📈</span>
                    <span className="font-bold text-xs">[Đồ thị / Bảng biến thiên nguyên bản]</span>
                    <span className="font-mono text-[11px] text-indigo-600 mt-1">Mã file: {imageCode || "HinhAnh.png"}</span>
                  </div>
                )}
              </div>
              <span className="whitespace-pre-wrap">{partAfter}</span>
            </div>
          ) : (
            <div>
              <div className="whitespace-pre-wrap">{content}</div>
              {(imageSrc || imageCode) && (
                <div className="my-3 flex flex-col items-center justify-center p-2 bg-slate-50 border rounded-xl">
                  {imageSrc ? (
                    <img src={imageSrc} alt="Hình vẽ đề bài" className="max-h-60 max-w-full rounded-lg object-contain shadow-sm" />
                  ) : (
                    <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                      <span className="text-3xl mb-1">📈</span>
                      <span className="font-bold text-xs">[Đồ thị / Bảng biến thiên đúng vị trí]</span>
                      <span className="font-mono text-[11px] text-indigo-600 mt-1">Mã file: {imageCode}</span>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function MathInline({ text }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(ref.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }
      }, [text]);
      return <span ref={ref} className="inline">{text}</span>;
    }

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" }
    ];

    const generate50MathQuestions = () => {
      const qList = [];
      for (let i = 1; i <= 50; i++) {
        const numStr = i < 10 ? '0' + i : '' + i;
        const code = `T05-${numStr}`;
        const hasImg = (i % 3 === 1);

        let content = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          content = `Cho hàm số bậc ba $y = f(x) = ax^3 + bx^2 + cx + d$ có đồ thị như hình vẽ bên dưới:[HINH_ANH]Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [`$m \in (-2; 2)$`, `$m \in [-1; 3]$`, `$m < -2$ hoặc $m > 2$`, `$m = 0$`];
          sol = `Phương trình tương đương $f(x) = 2m$. Dựa vào đồ thị trên hình vẽ, phương trình có 3 nghiệm phân biệt khi $-4 < 2m < 4 \Leftrightarrow -2 < m < 2$. Chọn đáp án A.`;
        } else if (i % 3 === 2) {
          content = `Biết tích phân $I = \int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và phân số tối giản. Giá trị biểu thức $S = a + b + c$ bằng:`;
          opts = [`$S = 9$`, `$S = 12$`, `$S = 15$`, `$S = 7$`];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow 2t dt = \frac{dx}{x}$. Ta tính được $I = \frac{4 - 2\sqrt{2}}{3}$. Suy ra $a = 4, b = 2, c = 3 \Rightarrow S = 4 + 2 + 3 = 9$.`;
        } else {
          content = `Trong không gian $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của $(S)$ đến $(P)$ là:`;
          opts = [`$d = \frac{13}{3}$`, `$d = 5$`, `$d = 3$`, `$d = \sqrt{29}$`];
          sol = `Tâm mặt cầu $I(1; -2; 3)$. Khoảng cách là $d(I, (P)) = \frac{|2(1) - 2(-2) + 1(3) + 4|}{\sqrt{2^2 + (-2)^2 + 1^2}} = \frac{13}{3}$.`;
        }

        qList.push({
          id: code,
          subject: "Toán",
          content: content,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : "",
          imageSrc: null,
          options: opts,
          correctIndex: 0,
          solution: sol
        });
      }
      return qList;
    };

    const generatePracticeQuestions = (mathList) => {
      const pList = [];
      mathList.slice(0, 15).forEach((q) => {
        for (let k = 1; k <= 3; k++) {
          let cleanContent = "";
          if (q.content.includes("Cho hàm số bậc ba")) {
            cleanContent = k === 1 
              ? `Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên như sau:[HINH_ANH]Tìm số nghiệm thực của phương trình $2f(x) + 3 = 0$.`
              : (k === 2 
                ? `Cho hàm số $y = f(x)$ có đồ thị như hình vẽ:[HINH_ANH]Có bao nhiêu giá trị nguyên của tham số $m \in [-5; 5]$ để phương trình $f(x) = m$ có 3 nghiệm phân biệt?`
                : `Cho hàm số $y = f(x)$ có đồ thị như hình vẽ bên:[HINH_ANH]Tìm tất cả các giá trị của $m$ để đồ thị cắt đường thẳng $y = m - 1$ tại đúng một điểm.`);
          } else if (q.content.includes("tích phân")) {
            cleanContent = k === 1
              ? `Biết tích phân $\int_{1}^{e} \frac{1 + \ln x}{x} dx = \frac{a}{b}$ với $a, b \in \mathbb{Z}^+$. Tính $a + b$.`
              : (k === 2
                ? `Cho tích phân $I = \int_{0}^{1} x e^x dx = a + b e$. Mệnh đề nào sau đây đúng?`
                : `Tính tích phân $J = \int_{1}^{2} \frac{2x + 1}{x^2 + x} dx$. Kết quả có dạng $\ln(\frac{a}{b})$. Tìm $a + b$.`);
          } else {
            cleanContent = k === 1
              ? `Trong không gian $Oxyz$, cho điểm $M(2; -1; 3)$ và mặt phẳng $(P): x - 2y + 2z - 1 = 0$. Khoảng cách từ $M$ đến mặt phẳng $(P)$ bằng:`
              : (k === 2
                ? `Trong không gian $Oxyz$, bán kính của mặt cầu $(S): x^2 + y^2 + z^2 - 2x + 4y - 6z + 5 = 0$ bằng:`
                : `Trong không gian $Oxyz$, cho mặt phẳng $(P): 3x - 4z + 1 = 0$. Vectơ nào dưới đây là một vectơ pháp tuyến của $(P)$?`);
          }

          pList.push({
            id: `${q.id}${k}`,
            subject: q.subject,
            content: cleanContent,
            hasImage: q.hasImage,
            imageCode: q.imageCode,
            imageSrc: null,
            options: q.options,
            correctIndex: (q.correctIndex + k) % 4,
            solution: `Lời giải chi tiết câu hỏi ${q.id}${k}.`
          });
        }
      });
      return pList;
    };

    const INITIAL_MATH_50 = generate50MathQuestions();
    const INITIAL_PRACTICE = generatePracticeQuestions(INITIAL_MATH_50);

    const INITIAL_EXAMS = [
      { 
        id: "EXAM-2026-01", 
        name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", 
        passCode: "HSA2026", 
        startTime: "2026-10-25 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 50
      }
    ];

    function App() {
      const [view, setView] = useState('student');
      const [adminTab, setAdminTab] = useState('root_bank'); // 'root_bank', 'practice_bank', 'upload_audit', 'import_exact', 'exam_creator', 'students'
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState(INITIAL_EXAMS);
      
      const [rootQuestions, setRootQuestions] = useState(INITIAL_MATH_50);
      const [practiceQuestions, setPracticeQuestions] = useState(INITIAL_PRACTICE);

      // Modal chỉnh sửa câu hỏi
      const [editingModalOpen, setEditingModalOpen] = useState(false);
      const [currentEditQuestion, setCurrentEditQuestion] = useState(null);

      // TẢI FILE ĐỀ & AI THẨM ĐỊNH (KHÔI PHỤC NÚT TẢI ĐỀ)
      const [uploadedFile, setUploadedFile] = useState(null);
      const [uploadedFileProgress, setUploadedFileProgress] = useState(0);
      const [rawQuestionText, setRawQuestionText] = useState("");
      const [auditSubject, setAuditSubject] = useState("T");
      const [analyzingAI, setAnalyzingAI] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      const fileInputRef = useRef(null);

      // Nạp câu hỏi thủ công chuẩn mã
      const [newSubjectCode, setNewSubjectCode] = useState("T");
      const [newExamCode, setNewExamCode] = useState("05");
      const [newOrderNum, setNewOrderNum] = useState("03");
      const [newContent, setNewContent] = useState("");
      const [newOptA, setNewOptA] = useState("");
      const [newOptB, setNewOptB] = useState("");
      const [newOptC, setNewOptC] = useState("");
      const [newOptD, setNewOptD] = useState("");
      const [newSolution, setNewSolution] = useState("");
      const [newHasImage, setNewHasImage] = useState(false);
      const [newImageCode, setNewImageCode] = useState("");
      const [newImageBase64, setNewImageBase64] = useState("");

      // Quản lý đợt thi
      const [createdExamName, setCreatedExamName] = useState("Đợt thi Khảo sát HSA Tháng 11");
      const [createdExamPasscode, setCreatedExamPasscode] = useState("HSA2026");
      const [createdExamFee, setCreatedExamFee] = useState("50.000 VNĐ");
      const [createdExamTime, setCreatedExamTime] = useState("2026-11-15T08:00");

      // Phòng thi học viên
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      const currentUser = students[currentUserIndex];

      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      useEffect(() => {
        if (studentMode !== 'exam') return;
        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const next = c + 1;
              if (next >= 3) {
                alert("CẢNH BÁO: Rời màn hình quá 3 lần! Bài thi tự động thu.");
                handleSubmitExam();
              }
              return next;
            });
          }
        };
        const handleBlur = () => setExamViolationCount(c => c + 1);
        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);
        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // XỬ LÝ TẢI FILE ĐỀ LÊN
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setUploadedFile(file);
        setUploadedFileProgress(25);

        const timer = setInterval(() => {
          setUploadedFileProgress(prev => {
            if (prev >= 100) {
              clearInterval(timer);
              setRawQuestionText(`[Bóc tách từ file ${file.name}]: Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên và đồ thị như hình vẽ bên dưới:[HINH_ANH]Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - m = 0$ có đúng 3 nghiệm thực phân biệt.`);
              return 100;
            }
            return prev + 35;
          });
        }, 300);
      };

      // KÍCH HOẠT AI THẨM ĐỊNH TỪ FILE VỪA TẢI
      const handleRunAiAudit = () => {
        if (!rawQuestionText.trim()) {
          alert("Vui lòng tải tệp đề bài lên hoặc dán nội dung câu hỏi!");
          return;
        }

        setAnalyzingAI(true);
        setTimeout(() => {
          const generatedId = `${auditSubject}05-${rootQuestions.length + 1 < 10 ? '0' + (rootQuestions.length + 1) : rootQuestions.length + 1}`;
          const result = {
            id: generatedId,
            subject: auditSubject === "T" ? "Toán" : (auditSubject === "V" ? "Văn" : "Lý"),
            content: rawQuestionText,
            hasImage: true,
            imageCode: `${generatedId}.png`,
            imageSrc: null,
            options: [
              `$m \in (-2; 4)$`,
              `$m \in [-2; 4]$`,
              `$m < -2$ hoặc $m > 4$`,
              `$m = 0$`
            ],
            correctIndex: 0,
            solution: `Lời giải thẩm định độc lập 100%: Dựa vào tương giao đồ thị, phương trình có 3 nghiệm phân biệt khi cực tiểu < m < cực đại <=> -2 < m < 4.`,
            variants: [
              {
                id: `${generatedId}1`,
                content: `Cho hàm số $y = f(x)$ có đồ thị như hình vẽ:[HINH_ANH]Có bao nhiêu giá trị nguyên của $m$ để phương trình $f(x) = 2m$ có 3 nghiệm?`,
                options: [`$m \in (-1; 2)$`, `$m \in [-1; 2]$`, `$m = 1$`, `$m = 3$`],
                correctIndex: 0
              },
              {
                id: `${generatedId}2`,
                content: `Cho hàm số $y = f(x)$ có bảng biến thiên:[HINH_ANH]Phương trình $f(x) + 1 = 0$ có bao nhiêu nghiệm?`,
                options: [`3 nghiệm`, `2 nghiệm`, `1 nghiệm`, `0 nghiệm`],
                correctIndex: 0
              },
              {
                id: `${generatedId}3`,
                content: `Tìm các giá trị của $m$ để đồ thị cắt đường thẳng $y = m - 1$ tại đúng một điểm.`,
                options: [`$m < -1$ hoặc $m > 5$`, `$-1 < m < 5$`, `$m = 0$`, `$m \in \mathbb{R}$`],
                correctIndex: 0
              }
            ]
          };
          setAiResult(result);
          setAnalyzingAI(false);
        }, 1200);
      };

      // LƯU CÂU HỎI THẨM ĐỊNH TỪ FILE VÀO NGÂN HÀNG
      const handleSaveAiAuditedQuestion = () => {
        if (!aiResult) return;

        const rootQ = {
          id: aiResult.id,
          subject: aiResult.subject,
          content: aiResult.content,
          hasImage: aiResult.hasImage,
          imageCode: aiResult.imageCode,
          imageSrc: null,
          options: aiResult.options,
          correctIndex: aiResult.correctIndex,
          solution: aiResult.solution
        };

        const newVariants = aiResult.variants.map(v => ({
          id: v.id,
          subject: aiResult.subject,
          content: v.content,
          hasImage: true,
          imageCode: aiResult.imageCode,
          imageSrc: null,
          options: v.options,
          correctIndex: v.correctIndex,
          solution: `Lời giải phái sinh cho câu ${v.id}.`
        }));

        setRootQuestions([rootQ, ...rootQuestions]);
        setPracticeQuestions([...newVariants, ...practiceQuestions]);

        alert(`ĐÃ DUYỆT THẨM ĐỊNH THÀNH CÔNG TỪ FILE TẢI LÊN!
- Đã nạp câu gốc ${rootQ.id} vào Ngân Hàng Đề Gốc.
- Đã nạp 3 câu luyện tập ${aiResult.variants.map(x => x.id).join(', ')} vào Ngân Hàng Luyện Tập.`);
        
        setAiResult(null);
        setRawQuestionText("");
        setUploadedFile(null);
        setUploadedFileProgress(0);
      };

      // Mở modal sửa câu
      const handleOpenEditModal = (q) => {
        setCurrentEditQuestion({ ...q, options: [...q.options] });
        setEditingModalOpen(true);
      };

      const handleUploadImageForEdit = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            setCurrentEditQuestion(prev => ({
              ...prev,
              hasImage: true,
              imageSrc: event.target.result,
              imageCode: `${prev.id}.png`
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveEdit = () => {
        if (!currentEditQuestion) return;
        setRootQuestions(rootQuestions.map(q => q.id === currentEditQuestion.id ? currentEditQuestion : q));
        setEditingModalOpen(false);
        alert(`Đã lưu câu hỏi ${currentEditQuestion.id}!`);
      };

      // Nạp câu hỏi thủ công
      const handleAddNewQuestion = () => {
        if (!newContent.trim()) {
          alert("Vui lòng nhập đề bài!");
          return;
        }

        const formattedId = `${newSubjectCode}${newExamCode}-${newOrderNum}`;
        const newQ = {
          id: formattedId,
          subject: newSubjectCode === "T" ? "Toán" : "Văn",
          content: newContent,
          hasImage: newHasImage,
          imageCode: newHasImage ? (newImageCode || `${formattedId}.png`) : "",
          imageSrc: newImageBase64 || null,
          options: [
            newOptA || "Phương án A",
            newOptB || "Phương án B",
            newOptC || "Phương án C",
            newOptD || "Phương án D"
          ],
          correctIndex: 0,
          solution: newSolution || "Lời giải chuẩn xác 100%."
        };

        const v1 = {
          id: `${formattedId}1`,
          subject: newQ.subject,
          content: `${newContent} (Biến thể số liệu 1)`,
          hasImage: newHasImage,
          imageCode: newQ.imageCode,
          imageSrc: newQ.imageSrc,
          options: newQ.options,
          correctIndex: 1,
          solution: `Lời giải phái sinh 1 của ${formattedId}.`
        };

        setRootQuestions([newQ, ...rootQuestions]);
        setPracticeQuestions([v1, ...practiceQuestions]);

        alert(`Đã nạp câu ${formattedId} vào ngân hàng!`);
        setNewContent("");
        setNewOptA("");
        setNewOptB("");
        setNewOptC("");
        setNewOptD("");

                          <span className="font-bold text-slate-700 uppercase block mb-3">Xem trước trực tiếp (KaTeX & Vị trí ảnh):</span>
                          {newContent ? (
                            <div className="bg-white p-4 rounded-xl border space-y-3">
                              <span className="font-mono font-bold text-blue-900 bg-amber-300 px-2 py-0.5 rounded text-xs">
                                {newSubjectCode}{newExamCode}-{newOrderNum}
                              </span>
                              <FormattedQuestionContent 
                                content={newContent} 
                                imageSrc={newImageBase64} 
                                imageCode={newImageCode || `${newSubjectCode}${newExamCode}-${newOrderNum}.png`} 
                              />
                              <div className="grid grid-cols-2 gap-2 pt-2 border-t">
                                <div className="p-2 border rounded"><MathInline text={`A. ${newOptA || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathInline text={`B. ${newOptB || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathInline text={`C. ${newOptC || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathInline text={`D. ${newOptD || '...'}`} /></div>
                              </div>
                            </div>
                          ) : (
                            <div className="h-64 flex items-center justify-center text-slate-400 text-center">
                              Chưa có nội dung xem trước.
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 5. QUẢN LÝ ĐỢT THI */}
                {adminTab === 'exam_creator' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h2 className="text-lg font-bold text-blue-950">Quản Lý & Xóa Đợt Thi</h2>
                    <div className="space-y-2">
                      {exams.map((ex) => (
                        <div key={ex.id} className="p-4 bg-white border rounded-xl flex justify-between items-center text-xs shadow-sm">
                          <div>
                            <span className="font-bold text-sm text-blue-950">{ex.name}</span>
                            <span className="ml-2 font-mono bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Mật khẩu: {ex.passCode}</span>
                          </div>
                          <button
                            onClick={() => {
                              if (confirm(`Xóa đợt thi ${ex.name}?`)) setExams(exams.filter(e => e.id !== ex.id));
                            }}
                            className="bg-rose-50 text-rose-700 border border-rose-200 font-bold px-3 py-1.5 rounded-lg"
                          >
                            🗑️ Xóa Đợt Thi
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 6. PHÊ DUYỆT LỆ PHÍ */}
                {adminTab === 'students' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h2 className="text-lg font-bold text-blue-950">Phê Duyệt Lệ Phí & Bật Quyền Dự Thi</h2>
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 border-b">
                        <tr>
                          <th className="py-2 px-3">Mã ID</th>
                          <th className="py-2 px-3">Họ Tên</th>
                          <th className="py-2 px-3 text-center">Lệ phí</th>
                          <th className="py-2 px-3 text-center">Điều kiện thi</th>
                          <th className="py-2 px-3 text-right">Thao tác</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-slate-700">
                        {students.map((st) => (
                          <tr key={st.id}>
                            <td className="py-2.5 px-3 font-mono font-bold text-blue-900">{st.id}</td>
                            <td className="py-2.5 px-3 font-semibold">{st.name}</td>
                            <td className="py-2.5 px-3 text-center">
                              {st.feeStatus === 'approved' ? <span className="text-emerald-700 font-bold">ĐÃ NỘP</span> : <span className="text-amber-700 font-bold">CHỜ DUYỆT</span>}
                            </td>
                            <td className="py-2.5 px-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${st.eligible ? 'bg-emerald-500 text-white' : 'bg-rose-100 text-rose-800'}`}>
                                {st.eligible ? "✓ ĐỦ ĐIỀU KIỆN" : "✗ KHÓA"}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-right">
                              <button
                                onClick={() => setStudents(students.map(s => s.id === st.id ? { ...s, eligible: !s.eligible, feeStatus: 'approved' } : s))}
                                className="text-blue-600 font-bold"
                              >
                                {st.eligible ? "Tắt quyền thi" : "Duyệt phí & Bật quyền thi"}
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* MODAL SỬA CÂU HỎI */}
                {editingModalOpen && currentEditQuestion && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white max-w-2xl w-full rounded-2xl p-6 shadow-2xl border space-y-4 max-h-[90vh] overflow-y-auto">
                      <div className="flex justify-between items-center border-b pb-3">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-base text-blue-950">Chỉnh Sửa & Dán Ảnh Đúng Vị Trí</span>
                          <span className="bg-amber-300 font-mono font-bold px-2 py-0.5 rounded text-xs">{currentEditQuestion.id}</span>
                        </div>
                        <button onClick={() => setEditingModalOpen(false)} className="text-slate-400 font-bold text-lg">✕</button>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div>
                          <div className="flex justify-between items-center mb-1">
                            <label className="font-bold text-slate-700">Nội dung đề bài:</label>
                            <span className="text-[11px] text-blue-600 cursor-pointer" onClick={() => {
                              setCurrentEditQuestion({
                                ...currentEditQuestion,
                                content: currentEditQuestion.content + " [HINH_ANH] "
                              });
                            }}>
                              + Chèn vị trí ảnh [HINH_ANH]
                            </span>
                          </div>
                          <textarea
                            rows="4"
                            value={currentEditQuestion.content}
                            onChange={(e) => setCurrentEditQuestion({ ...currentEditQuestion, content: e.target.value })}
                            className="w-full border rounded-xl p-2.5 font-mono focus:ring-2 focus:ring-blue-600 outline-none"
                          ></textarea>
                        </div>

                        <div className="p-3 bg-slate-50 border rounded-xl space-y-2">
                          <span className="font-bold text-slate-800 block">Dán tệp ảnh từ máy tính vào câu hỏi:</span>
                          <div className="flex items-center gap-3">
                            <input
                              type="file"
                              accept="image/*"
                              onChange={handleUploadImageForEdit}
                              className="text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold cursor-pointer"
                            />
                            {currentEditQuestion.imageSrc && (
                              <button
                                onClick={() => setCurrentEditQuestion({ ...currentEditQuestion, imageSrc: null, hasImage: false })}
                                className="text-rose-600 hover:text-rose-800 font-semibold text-xs"
                              >
                                Gỡ ảnh
                              </button>
                            )}
                          </div>

                          {currentEditQuestion.imageSrc && (
                            <div className="mt-2 p-2 bg-white border rounded-lg flex flex-col items-center">
                              <img src={currentEditQuestion.imageSrc} alt="Preview" className="max-h-36 rounded border" />
                            </div>
                          )}
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          {currentEditQuestion.options.map((opt, idx) => (
                            <div key={idx}>
                              <label className="block font-semibold text-slate-600 mb-0.5">Phương án {String.fromCharCode(65 + idx)}:</label>
                              <input
                                type="text"
                                value={opt}
                                onChange={(e) => {
                                  const newOpts = [...currentEditQuestion.options];
                                  newOpts[idx] = e.target.value;
                                  setCurrentEditQuestion({ ...currentEditQuestion, options: newOpts });
                                }}
                                className="w-full border rounded-lg px-2.5 py-1.5 font-mono"
                              />
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="flex gap-2 pt-2 border-t">
                        <button onClick={() => setEditingModalOpen(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Hủy</button>
                        <button onClick={handleSaveEdit} className="flex-1 py-2 bg-blue-700 text-white font-bold rounded-xl text-xs shadow">
                          Lưu Thay Đổi
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              /* ==================== PHÒNG HỌC VIÊN ==================== */
              <div>
                {studentMode === 'hub' && (
                  <div className="space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-lg font-bold text-slate-900">{currentUser.name}</h2>
                          <span className="bg-blue-100 text-blue-900 font-mono font-bold text-xs px-2.5 py-0.5 rounded-full">{currentUser.id}</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">Đợt thi: <strong>{exams[0]?.name || "Đợt thi"}</strong></p>
                      </div>

                      <div className="flex items-center gap-3">
                        {currentUser.feeStatus === 'approved' && currentUser.eligible ? (
                          <div className="flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <span className="text-xs font-bold text-emerald-800">ĐÃ DUYỆT: ĐỦ ĐIỀU KIỆN DỰ THI</span>
                          </div>
                        ) : (
                          <button
                            onClick={() => {
                              setPaymentRefCode(`HSA-${currentUser.id}-99`);
                              setShowPaymentModal(true);
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow"
                          >
                            💳 Đăng Ký Thi & Nộp Phí ({exams[0]?.fee || "50.000 VNĐ"})
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-indigo-50 text-indigo-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">📖</div>
                          <h3 className="text-base font-bold text-slate-900 mb-1">Phòng Luyện Tập Theo Chuyên Đề</h3>
                          <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                            Mở tự do. Ôn luyện câu hỏi luyện tập hiển thị đề bài thuần túy, công thức toán KaTeX chuẩn và ảnh đồ thị nằm đúng vị trí.
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            setCurrentExamQuestions(practiceQuestions.slice(0, 30));
                            setAnswers({});
                            setTimeLeft(45 * 60);
                            setActiveQuestionIdx(0);
                            setStudentMode('practice');
                          }}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs"
                        >
                          Vào Luyện Tập Tự Do (30 câu)
                        </button>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border-2 border-blue-600/30 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">🎓</div>
                          <h3 className="text-base font-bold text-slate-900">Phòng Thi Chính Thức ({exams[0]?.name || "Đợt thi"})</h3>
                          <p className="text-xs text-slate-500 mt-1 mb-3">
                            Lấy đúng 50 câu Toán chuẩn cấu trúc mã định danh (T05-01 đến T05-50). Hiển thị công thức KaTeX sắc nét và ảnh đồ thị đúng vị trí.
                          </p>

                          <div className="space-y-2 bg-slate-50 p-3 rounded-xl border mb-4">
                            <label className="block text-[11px] font-bold text-slate-600 uppercase">Mật khẩu đợt thi:</label>
                            <input
                              type="password"
                              placeholder={`Nhập ${exams[0]?.passCode || "HSA2026"}...`}
                              value={examPasscode}
                              onChange={(e) => setExamPasscode(e.target.value)}
                              className="w-full border rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                        </div>

                        <button
                          onClick={handleStartExam}
                          className={`w-full py-2.5 rounded-xl font-bold text-xs transition shadow ${currentUser.eligible && currentUser.feeStatus === 'approved' ? 'bg-blue-700 hover:bg-blue-800 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                        >
                          {currentUser.eligible && currentUser.feeStatus === 'approved' ? "Bắt Đầu Thi (Lấy Đủ 50 Câu Toán)" : "Chưa đủ điều kiện (Cần nộp phí & duyệt)"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODAL NỘP PHÍ */}
                {showPaymentModal && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
                      <div className="flex justify-between items-center border-b pb-3">
                        <h3 className="font-bold text-base text-slate-900">Đăng Ký Dự Thi & Nộp Lệ Phí</h3>
                        <button onClick={() => setShowPaymentModal(false)} className="text-slate-400 font-bold">✕</button>
                      </div>
                      <div className="text-xs space-y-1 text-slate-600">
                        <p>Thí sinh: <strong>{currentUser.name}</strong> ({currentUser.id})</p>
                        <p>Lệ phí: <strong className="text-rose-600 font-bold">{exams[0]?.fee || "50.000 VNĐ"}</strong></p>
                      </div>
                      <div className="bg-slate-50 border rounded-xl p-4 text-center">
                        <div className="w-32 h-32 bg-white border-2 border-slate-300 rounded mx-auto flex items-center justify-center font-black text-xl">
                          VIETQR
                        </div>
                        <p className="text-[11px] text-slate-500 mt-2 font-mono">Mã CK: <strong>{paymentRefCode}</strong></p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setShowPaymentModal(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Hủy</button>
                        <button
                          onClick={() => {
                            setStudents(students.map(s => s.id === currentUser.id ? { ...s, feeStatus: 'pending', regTime: new Date().toLocaleString('vi-VN') } : s));
                            setShowPaymentModal(false);
                            alert("Đã gửi xác nhận nộp phí! Vui lòng chờ duyệt.");
                          }}
                          className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                        >
                          Xác Nhận Đã Chuyển Tiền
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH LÀM BÀI ĐỦ 50 CÂU */}
                {(studentMode === 'exam' || studentMode === 'practice') && (
                  <div className="space-y-4 no-select">
                    {studentMode === 'exam' && examViolationCount > 0 && (
                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center">
                        <span className="font-bold">⚠️ RỜI MÀN HÌNH {examViolationCount}/3 LẦN! (Quá 3 lần sẽ tự động thu bài).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? `ĐỢT THI CHÍNH THỨC (${currentExamQuestions.length} CÂU)` : `BÀI LUYỆN TẬP (${currentExamQuestions.length} CÂU)`}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button
                          onClick={handleSubmitExam}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow"
                        >
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} (Mã: {currentExamQuestions[activeQuestionIdx].id})
                              </span>
                            </div>

                            <div className="mb-4">
                              <FormattedQuestionContent 
                                content={currentExamQuestions[activeQuestionIdx].content}
                                imageSrc={currentExamQuestions[activeQuestionIdx].imageSrc}
                                imageCode={currentExamQuestions[activeQuestionIdx].imageCode}
                              />
                            </div>

                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <MathInline text={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold text-slate-700 uppercase">Mục lục ({currentExamQuestions.length} câu)</h4>
                          <span className="text-[11px] font-bold text-blue-700 font-mono">
                            {Object.keys(answers).length}/{currentExamQuestions.length}
                          </span>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* KẾT QUẢ */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="text-center pb-4 border-b">
                      <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI TOÁN & XỬ LÝ SỐ LIỆU (50 CÂU)</h2>
                      <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số vi phạm: {examFinishedData.violations}</p>
                      
                      <div className="inline-block mt-4 bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                        <span className="text-xs text-blue-700 font-bold uppercase">Điểm Số Đạt Được</span>
                        <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                      </div>
                    </div>

                    <button
                      onClick={() => setStudentMode('hub')}
                      className="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs"
                    >
                      Trở về Bảng Điều Khiển Học Viên
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
