<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // HỌC SINH MẪU
    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" },
      { id: "07-TP-003", name: "Lê Hoàng Long", birthYear: "2007", classUnit: "TP", email: "long.le@example.com", eligible: false, feeStatus: "unregistered", regTime: "-" }
    ];

    // SINH ĐỦ 50 CÂU TOÁN CHUẨN HSA (GỒM CẢ CÂU GỐC VÀ CÂU LUYỆN TẬP PHÁI SINH)
    const generate50MathQuestions = () => {
      const topics = [
        "Khảo sát hàm số & Ứng dụng đạo hàm",
        "Hàm số Mũ - Logarit & Bất phương trình",
        "Nguyên hàm - Tích phân & Ứng dụng thực tế",
        "Phương pháp tọa độ Oxyz trong không gian",
        "Hình học không gian (Góc, Khoảng cách, Thể tích)",
        "Thống kê mẫu số liệu ghép nhóm & Xác suất cổ điển",
        "Cấp số cộng, Cấp số nhân & Dãy số",
        "Xử lý số liệu, Biểu đồ & Tối ưu hóa kinh tế"
      ];
      const levels = ["B", "H", "VD", "VDC"];
      
      const qList = [];
      for (let i = 1; i <= 50; i++) {
        const topic = topics[(i - 1) % topics.length];
        const lvl = i <= 13 ? "B" : (i <= 28 ? "H" : (i <= 43 ? "VD" : "VDC"));
        const hasImg = i % 4 === 1;
        const code = `T10-01-${i < 10 ? '0' + i : i}`;
        
        qList.push({
          id: code,
          subject: "Toán",
          topic: topic,
          level: lvl,
          part: "math",
          content: `Câu ${i}: [${topic}] Cho bài toán thực tế chuẩn CT GDPT 2018 liên quan đến ${topic.toLowerCase()}. Xác định kết quả chính xác của đại lượng cần tìm.`,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : null,
          options: [
            `Phương án A: Giá trị tương ứng với ${i * 2 + 1}`,
            `Phương án B: Nghiệm tối ưu của bài toán ${i * 3 + 5}`,
            `Phương án C: Hệ số biến thiên cực trị ${i * 4}`,
            `Phương án D: Khoảng giá trị tham số (-${i}; ${i})`
          ],
          correctIndex: (i % 4),
          solution: `Lời giải thẩm định độc lập cho câu ${code}: Bước 1 áp dụng định nghĩa chuyên đề ${topic}, bước 2 giải hệ điều kiện biên, kết luận nghiệm duy nhất là phương án ${String.fromCharCode(65 + (i % 4))}.`,
          status: "approved"
        });
      }
      return qList;
    };

    // NGÂN HÀNG LUYỆN TẬP PHÁI SINH
    const generatePracticeQuestions = (mathList) => {
      const pList = [];
      mathList.slice(0, 20).forEach((q) => {
        for (let k = 1; k <= 3; k++) {
          pList.push({
            id: `${q.id}${k}`,
            rootId: q.id,
            subject: q.subject,
            topic: q.topic,
            level: q.level,
            content: `[Câu phái sinh ${k} từ ${q.id}] ${q.content.replace("Cho bài toán", "Biến thể bài toán")} (thay đổi tham số và số liệu).`,
            options: q.options.map((opt, idx) => opt + ` (biến đổi ${k})`),
            correctIndex: (q.correctIndex + k) % 4,
            solution: `Lời giải chi tiết câu phái sinh ${q.id}${k}: Dựa trên ma trận độ khó câu gốc ${q.id}, giải theo số liệu mới.`,
            status: "approved"
          });
        }
      });
      return pList;
    };

    const INITIAL_MATH_50 = generate50MathQuestions();
    const INITIAL_PRACTICE = generatePracticeQuestions(INITIAL_MATH_50);

    const INITIAL_EXAMS = [
      { 
        id: "EXAM-2026-01", 
        name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", 
        passCode: "HSA2026", 
        startTime: "2026-10-25 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 50,
        matrix: { b: 26, h: 30, vd: 30, vdc: 14 },
        active: true 
      }
    ];

    function App() {
      const [view, setView] = useState('student'); // 'student' hoặc 'admin'
      const [adminTab, setAdminTab] = useState('root_bank'); // 'root_bank', 'practice_bank', 'exam_creator', 'ai_audit', 'students'
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState(INITIAL_EXAMS);
      
      // Ngân hàng đề gốc & Ngân hàng luyện thi
      const [rootQuestions, setRootQuestions] = useState(INITIAL_MATH_50);
      const [practiceQuestions, setPracticeQuestions] = useState(INITIAL_PRACTICE);

      // Bộ lọc trong ngân hàng
      const [filterSubject, setFilterSubject] = useState("Tất cả");
      const [filterLevel, setFilterLevel] = useState("Tất cả");

      // Chỉnh sửa câu hỏi trong ngân hàng
      const [editingQuestion, setEditingQuestion] = useState(null);

      // Trạng thái phòng học viên
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [electiveChoice, setElectiveChoice] = useState('english');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      // Modal thanh toán
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      // Tải file & AI Thẩm định
      const [uploadedFile, setUploadedFile] = useState(null);
      const [rawQuestionText, setRawQuestionText] = useState("");
      const [selectedSubject, setSelectedSubject] = useState("Toán");
      const [analyzingAI, setAnalyzingAI] = useState(false);
      const [aiResult, setAiResult] = useState(null);
      const fileInputRef = useRef(null);

      // Phòng tạo đề
      const [newExamName, setNewExamName] = useState("Đợt thi Khảo sát Năng lực HSA Chuẩn 2026");
      const [newExamPasscode, setNewExamPasscode] = useState("HSA2026");
      const [newExamTime, setNewExamTime] = useState("2026-11-01T08:00");
      const [newExamFee, setNewExamFee] = useState("50.000 VNĐ");
      const [matrixB, setMatrixB] = useState(26);
      const [matrixH, setMatrixH] = useState(30);
      const [matrixVD, setMatrixVD] = useState(30);
      const [matrixVDC, setMatrixVDC] = useState(14);

      const currentUser = students[currentUserIndex];

      // Đếm ngược thời gian thi
      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      // Chống rời màn hình
      useEffect(() => {
        if (studentMode !== 'exam') return;
        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const nextCount = c + 1;
              if (nextCount >= 3) {
                alert("CẢNH BÁO: Rời màn hình quá 3 lần! Bài thi tự động thu.");
                handleSubmitExam();
              }
              return nextCount;
            });
          }
        };
        const handleBlur = () => setExamViolationCount(c => c + 1);
        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);
        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // Xóa câu hỏi trong ngân hàng
      const handleDeleteRootQuestion = (id) => {
        if (confirm(`Bạn có chắc muốn xóa câu hỏi ${id} khỏi Ngân hàng Đề Gốc?`)) {
          setRootQuestions(rootQuestions.filter(q => q.id !== id));
        }
      };

      const handleDeletePracticeQuestion = (id) => {
        if (confirm(`Bạn có chắc muốn xóa câu hỏi luyện tập ${id}?`)) {
          setPracticeQuestions(practiceQuestions.filter(q => q.id !== id));
        }
      };

      // Lưu sau khi chỉnh sửa và tái kích hoạt thẩm định
      const handleSaveEditedQuestion = () => {
        if (!editingQuestion) return;
        alert(`Đã kích hoạt quy trình thẩm định lại cho câu ${editingQuestion.id} và cập nhật vào ngân hàng!`);
        setRootQuestions(rootQuestions.map(q => q.id === editingQuestion.id ? editingQuestion : q));
        setEditingQuestion(null);
      };

      // Tải file đề
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadedFile(file);
        setRawQuestionText(`[Đã bóc tách từ ${file.name}]: Cho bài toán khảo sát đồ thị hàm số y = f(x). Hãy xác định giá trị cực trị và nghiệm của phương trình f(x) = m.`);
      };

      // Kích hoạt AI Thẩm định
      const handleRunAiAudit = () => {
        if (!rawQuestionText.trim()) return alert("Vui lòng nhập nội dung đề!");
        setAnalyzingAI(true);
        setTimeout(() => {
          const generatedId = `T10-02-${Math.floor(10 + Math.random() * 89)}`;
          const result = {
            id: generatedId,
            subject: selectedSubject,
            topic: "Khảo sát hàm số (CT GDPT 2018)",
            level: "VD",
            content: rawQuestionText,
            imageCode: `${generatedId}.png`,
            options: ["m < -2", "-2 < m < 4", "m > 4", "m = 0"],
            correctIndex: 1,
            solution: "Lời giải thẩm định độc lập: Dựa trên tương giao đồ thị, giá trị m thỏa mãn là -2 < m < 4.",
            variants: [
              { id: `${generatedId}1`, content: `[Phái sinh 1]: Tìm m để f(x) = 2m có 3 nghiệm.`, options: ["A", "B", "C", "D"], correctIndex: 1 },
              { id: `${generatedId}2`, content: `[Phái sinh 2]: Tính tổng các giá trị nguyên của m.`, options: ["5", "6", "7", "8"], correctIndex: 0 },
              { id: `${generatedId}3`, content: `[Phái sinh 3]: Tìm khoảng đơn điệu của hàm số.`, options: ["(0; 2)", "(-1; 1)", "(2; 4)", "R"], correctIndex: 0 }
            ]
          };
          setAiResult(result);
          setAnalyzingAI(false);
        }, 800);
      };

      const handleSaveAiQuestion = () => {
        if (!aiResult) return;
        setRootQuestions([aiResult, ...rootQuestions]);
        const newVariants = aiResult.variants.map(v => ({
          ...v,
          subject: aiResult.subject,
          topic: aiResult.topic,
          level: aiResult.level,
          solution: "Lời giải chi tiết câu phái sinh."
        }));
        setPracticeQuestions([...newVariants, ...practiceQuestions]);
        alert(`Đã duyệt chuyển câu gốc ${aiResult.id} vào Ngân Hàng Đề Gốc và 3 câu phái sinh vào Ngân Hàng Luyện Tập!`);
        setAiResult(null);
        setRawQuestionText("");
        setUploadedFile(null);
      };

      // Tạo đợt thi mới (Kích hoạt lấy đủ 50 câu Toán)
      const handleCreateNewExam = () => {
        const newExam = {
          id: `EXAM-${Date.now().toString().slice(-4)}`,
          name: newExamName,
          passCode: newExamPasscode,
          startTime: newExamTime.replace("T", " "),
          fee: newExamFee,
          totalQuestions: 50,
          matrix: { b: matrixB, h: matrixH, vd: matrixVD, vdc: matrixVDC },
          active: true
        };
        setExams([newExam, ...exams]);
        alert(`TẠO ĐỢT THI THÀNH CÔNG!
Đã kết nối Ngân Hàng Đề Gốc để sinh ĐỦ 50 CÂU TOÁN (75 phút) theo đúng ma trận B-H-VD-VDC.`);
      };

      // Bắt đầu thi (Lấy ĐỦ 50 CÂU từ Ngân hàng Đề Gốc)
      const handleStartExam = () => {
        if (currentUser.feeStatus !== 'approved' || !currentUser.eligible) {
          alert("BẠN CHƯA ĐỦ ĐIỀU KIỆN! Vui lòng nộp lệ phí và chờ Quản trị viên duyệt.");
          return;
        }
        if (examPasscode.trim() !== exams[0].passCode) {
          alert(`Mật khẩu đợt thi không đúng! (Mật khẩu: ${exams[0].passCode})`);
          return;
        }

        // Lấy đúng 50 câu từ ngân hàng đề gốc
        const full50Math = rootQuestions.filter(q => q.subject === "Toán").slice(0, 50);
        setCurrentExamQuestions(full50Math);
        setAnswers({});
        setTimeLeft(75 * 60); // 75 phút chuẩn HSA
        setExamViolationCount(0);
        setActiveQuestionIdx(0);
        setStudentMode('exam');
      };

      // Nộp bài thi
      const handleSubmitExam = () => {
        let total = 0;
        currentExamQuestions.forEach((q, idx) => {
          if (answers[idx] === q.correctIndex) total += 1;
        });

        setExamFinishedData({
          total: total,
          questions: currentExamQuestions,
          userAnswers: answers,
          violations: examViolationCount
        });
        setStudentMode('result');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-black text-xl shadow">
                  HSA
                </div>
                <div>
                  <h1 className="font-bold text-lg md:text-xl tracking-tight leading-none">HỆ THỐNG LUYỆN THI ĐÁNH GIÁ NĂNG LỰC</h1>
                  <span className="text-xs text-blue-200">ĐHQGHN • CT GDPT 2018 • Khảo Thí & Thẩm Định Độc Lập</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="hidden md:flex items-center bg-blue-950/70 px-2 py-1 rounded text-xs">
                  <span className="text-slate-300 mr-2">Đang đóng vai:</span>
                  <select 
                    value={currentUserIndex} 
                    onChange={(e) => setCurrentUserIndex(Number(e.target.value))}
                    className="bg-transparent text-amber-300 font-bold outline-none cursor-pointer"
                  >
                    {students.map((st, i) => (
                      <option key={st.id} value={i} className="text-slate-900">
                        {st.name} ({st.id} - {st.feeStatus === 'approved' ? 'Đã duyệt' : st.feeStatus === 'pending' ? 'Chờ duyệt' : 'Chưa nộp phí'})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex bg-blue-950/80 p-1 rounded-lg border border-blue-700/50">
                  <button
                    onClick={() => { setView('student'); setStudentMode('hub'); }}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'student' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Học Viên
                  </button>
                  <button
                    onClick={() => setView('admin')}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Quản Trị
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {view === 'admin' ? (
              /* ==================== PHÒNG QUẢN TRỊ ==================== */
              <div className="space-y-6">
                {/* THANH ĐIỀU HƯỚNG CÁC PHÒNG TRONG QUẢN TRỊ */}
                <div className="bg-white p-2 rounded-2xl shadow-sm border flex flex-wrap gap-2">
                  <button
                    onClick={() => setAdminTab('root_bank')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'root_bank' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📚 1. Ngân Hàng Đề Gốc ({rootQuestions.length} câu)
                  </button>
                  <button
                    onClick={() => setAdminTab('practice_bank')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'practice_bank' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    🎯 2. Ngân Hàng Luyện Tập ({practiceQuestions.length} câu)
                  </button>
                  <button
                    onClick={() => setAdminTab('exam_creator')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'exam_creator' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    🛠️ 3. Phòng Tạo Đợt Thi
                  </button>
                  <button
                    onClick={() => setAdminTab('ai_audit')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'ai_audit' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📤 4. Tải File & AI Thẩm Định
                  </button>
                  <button
                    onClick={() => setAdminTab('students')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'students' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    👥 5. Duyệt Phí & Thí Sinh
                  </button>
                </div>

                {/* 1. PHÂN HỆ: NGÂN HÀNG ĐỀ GỐC */}
                {adminTab === 'root_bank' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-4 gap-2">
                      <div>
                        <h2 className="text-lg font-bold text-blue-950">Ngân Hàng Đề Gốc (Hội Đồng Kiểm Duyệt Lần Cuối)</h2>
                        <p className="text-xs text-slate-500">Chứa toàn bộ câu hỏi gốc đã thẩm định. Quản trị viên có quyền sửa, xóa hoặc thẩm định lại câu hỏi.</p>
                      </div>
                      <div className="flex gap-2">
                        <span className="bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full text-xs">
                          Hiện có: {rootQuestions.length} câu chuẩn
                        </span>
                      </div>
                    </div>

                    {/* Danh sách câu hỏi */}
                    <div className="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                      {rootQuestions.map((q, idx) => (
                        <div key={q.id} className="p-4 bg-slate-50 border rounded-xl hover:border-blue-400 transition text-xs space-y-2">
                          <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-bold text-blue-900 bg-blue-100 px-2 py-0.5 rounded">{q.id}</span>
                              <span className="font-bold text-slate-700">Môn: {q.subject}</span>
                              <span className="text-slate-500">• {q.topic}</span>
                              <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${q.level === 'VDC' ? 'bg-rose-100 text-rose-800' : q.level === 'VD' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                Mức: {q.level}
                              </span>
                              {q.hasImage && <span className="bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-mono text-[10px]">Ảnh: {q.imageCode}</span>}
                            </div>
                            <div className="flex gap-2">
                              <button
                                onClick={() => setEditingQuestion(q)}
                                className="text-blue-600 hover:text-blue-800 font-semibold px-2 py-1 border rounded bg-white"
                              >
                                ✏️ Chỉnh sửa
                              </button>
                              <button

                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center">
                        <span className="font-bold">⚠️ RỜI MÀN HÌNH {examViolationCount}/3 LẦN! (Quá 3 lần sẽ tự động thu bài).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? `ĐỢT THI CHÍNH THỨC (${currentExamQuestions.length} CÂU TOÁN)` : `BÀI LUYỆN TẬP (${currentExamQuestions.length} CÂU)`}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button
                          onClick={handleSubmitExam}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow"
                        >
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      {/* Cột hiển thị câu hỏi chi tiết */}
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} ({currentExamQuestions[activeQuestionIdx].id})
                              </span>
                              <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                Mức: {currentExamQuestions[activeQuestionIdx].level} | {currentExamQuestions[activeQuestionIdx].topic}
                              </span>
                            </div>

                            <p className="text-sm font-medium text-slate-800 leading-relaxed mb-4">
                              {currentExamQuestions[activeQuestionIdx].content}
                            </p>

                            {currentExamQuestions[activeQuestionIdx].hasImage && (
                              <div className="my-3 p-3 bg-slate-50 border rounded-lg text-center">
                                <div className="inline-block bg-white border px-8 py-6 rounded text-xs text-slate-500 font-mono">
                                  [Hình vẽ/Đồ thị tách riêng mã: {currentExamQuestions[activeQuestionIdx].imageCode}]
                                </div>
                              </div>
                            )}

                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <span>{opt}</span>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Mục lục đủ 50 câu hỏi bên phải */}
                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold text-slate-700 uppercase">Mục lục ({currentExamQuestions.length} câu)</h4>
                          <span className="text-[11px] font-bold text-blue-700 font-mono">
                            {Object.keys(answers).length}/{currentExamQuestions.length}
                          </span>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH KẾT QUẢ ĐỦ 50 CÂU */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="text-center pb-4 border-b">
                      <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI TOÁN & XỬ LÝ SỐ LIỆU (50 CÂU)</h2>
                      <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số vi phạm rời màn hình: {examFinishedData.violations}</p>
                      
                      <div className="inline-block mt-4 bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                        <span className="text-xs text-blue-700 font-bold uppercase">Điểm Số Đạt Được</span>
                        <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                      </div>
                    </div>

                    <button
                      onClick={() => setStudentMode('hub')}
                      className="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs"
                    >
                      Trở về Bảng Điều Khiển Học Viên
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
