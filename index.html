<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
    .katex { font-size: 1.08em; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root">
    <div style="padding: 24px; text-align: center; font-family: sans-serif; color: #1e3a8a; font-weight: bold;">
      Đang tải Hệ thống Luyện thi Đánh giá Năng lực HSA 2026...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUBJECT_LIST = [
      { code: "T", name: "Toán học & Xử lý số liệu" },
      { code: "V", name: "Ngữ văn - Đọc hiểu" },
      { code: "L", name: "Vật lý" },
      { code: "H", name: "Hóa học" },
      { code: "B", name: "Sinh học" },
      { code: "S", name: "Lịch sử" },
      { code: "D", name: "Địa lý" },
      { code: "E", name: "Tiếng Anh" }
    ];

    // Bảng biến thiên SVG mẫu
    const SAMPLE_VARIATION_TABLE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='460' height='160' viewBox='0 0 460 160'><rect width='460' height='160' fill='%23ffffff' stroke='%23334155' stroke-width='2'/><line x1='60' y1='0' x2='60' y2='160' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='40' x2='460' y2='40' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='80' x2='460' y2='80' stroke='%23334155' stroke-width='1.5'/><text x='25' y='26' font-family='sans-serif' font-size='14' font-weight='bold'>x</text><text x='15' y='65' font-family='sans-serif' font-size='14' font-weight='bold'>f'(x)</text><text x='15' y='125' font-family='sans-serif' font-size='14' font-weight='bold'>f(x)</text><text x='80' y='26' font-size='13'>-∞</text><text x='180' y='26' font-size='13'>-1</text><text x='280' y='26' font-size='13'>1</text><text x='390' y='26' font-size='13'>+∞</text><text x='130' y='65' font-size='14' fill='%2310b981'>+</text><text x='180' y='65' font-size='14'>0</text><text x='230' y='65' font-size='14' fill='%23ef4444'>-</text><text x='280' y='65' font-size='14'>0</text><text x='330' y='65' font-size='14' fill='%2310b981'>+</text><text x='80' y='145' font-size='12'>-∞</text><text x='180' y='95' font-size='13' font-weight='bold' fill='%23059669'>2</text><text x='280' y='145' font-size='13' font-weight='bold' fill='%23ea580c'>-2</text><text x='390' y='95' font-size='12'>+∞</text><line x1='100' y1='140' x2='170' y2='100' stroke='%2310b981' stroke-width='2'/><line x1='195' y1='100' x2='270' y2='140' stroke='%23ef4444' stroke-width='2'/><line x1='295' y1='140' x2='380' y2='100' stroke='%2310b981' stroke-width='2'/></svg>";

    // BỘ TỰ ĐỘNG CHUYỂN MÃ TCVN3 (ABC / .VnTime) SANG UNICODE
    function convertTCVN3ToUnicode(str) {
      if (!str) return "";
      const tcvnChars = "a¸µ¶·¹¨ÊÇÈÉË©ÐÌÎÏÑéåæçèªóîïñò¡¢£¤¥¦§íëìîïóõö÷øùúûüý";
      const uniChars = "àảãáạăằẳẵắặâầẩẫấậèẻẽéẹêềểễếệìỉĩíịòỏõóọôồổỗốộơờởỡớợùủũúụưừửữứựỳỷỹýỵ";
      let res = "";
      for (let i = 0; i < str.length; i++) {
        const c = str[i];
        const idx = tcvnChars.indexOf(c);
        if (idx !== -1 && idx < uniChars.length) {
          res += uniChars[idx];
        } else {
          res += c;
        }
      }
      return res;
    }

    // Component hiển thị KaTeX & Hình ảnh dán đúng vị trí
    function SafeRenderMath({ text, imageSrc, imageCode }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\[", right: "\\]", display: true },
                { left: "\\(", right: "\\)", display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }
      }, [text]);

      if (!text) return null;

      const hasPlaceholder = text.includes("[HINH_ANH]");
      let partBefore = text;
      let partAfter = "";

      if (hasPlaceholder) {
        const parts = text.split("[HINH_ANH]");
        partBefore = parts[0];
        partAfter = parts[1] || "";
      }

      return (
        <div ref={containerRef} className="text-sm leading-relaxed text-slate-900 space-y-2">
          {hasPlaceholder ? (
            <div>
              <div className="whitespace-pre-wrap">{partBefore}</div>
              <div className="my-3 flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-inner">
                {imageSrc ? (
                  <img src={imageSrc} alt="Hình vẽ / Bảng biến thiên" className="max-h-72 max-w-full rounded-lg object-contain shadow" />
                ) : (
                  <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                    <span className="text-3xl mb-1">📈</span>
                    <span className="font-bold text-xs">[Vị trí Bảng biến thiên / Đồ thị]</span>
                    <span className="font-mono text-[11px] text-indigo-600 mt-0.5">Mã: {imageCode || "HinhAnh.png"}</span>
                  </div>
                )}
              </div>
              <div className="whitespace-pre-wrap">{partAfter}</div>
            </div>
          ) : (
            <div>
              <div className="whitespace-pre-wrap">{text}</div>
              {(imageSrc || imageCode) && (
                <div className="my-3 flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-inner">
                  {imageSrc ? (
                    <img src={imageSrc} alt="Hình vẽ / Bảng biến thiên" className="max-h-72 max-w-full rounded-lg object-contain shadow" />
                  ) : (
                    <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                      <span className="text-3xl mb-1">📈</span>
                      <span className="font-bold text-xs">[Bảng biến thiên / Đồ thị đặt tại đây]</span>
                      <span className="font-mono text-[11px] text-indigo-600 mt-0.5">Mã: {imageCode}</span>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function InlineMath({ text }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(ref.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }
      }, [text]);
      return <span ref={ref} className="inline">{text}</span>;
    }

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" }
    ];

    const generate50MathQuestions = () => {
      const qList = [];
      for (let i = 1; i <= 50; i++) {
        const numStr = i < 10 ? '0' + i : '' + i;
        const code = `T01-${numStr}`;
        const hasImg = (i % 3 === 1);

        let content = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          content = `Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên như hình dưới đây:[HINH_ANH]Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [`$m \in (-1; 1)$`, `$m \in [-2; 2]$`, `$m < -1$ hoặc $m > 1$`, `$m = 0$`];
          sol = `Dựa vào bảng biến thiên, phương trình có 3 nghiệm phân biệt khi cực tiểu < 2m < cực đại <=> -2 < 2m < 2 <=> -1 < m < 1.`;
        } else if (i % 3 === 2) {
          content = `Biết tích phân $I = \int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và $\frac{a}{c}$ tối giản. Giá trị của biểu thức $S = a + b + c$ bằng:`;
          opts = [`$S = 9$`, `$S = 12$`, `$S = 15$`, `$S = 7$`];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow 2t dt = \frac{dx}{x}$. Ta tính được $I = \frac{4 - 2\sqrt{2}}{3} \Rightarrow S = 4 + 2 + 3 = 9$.`;
        } else {
          content = `Trong không gian $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của $(S)$ đến $(P)$ là:`;
          opts = [`$d = \frac{13}{3}$`, `$d = 5$`, `$d = 3$`, `$d = \sqrt{29}$`];
          sol = `Tâm mặt cầu $I(1; -2; 3)$. Áp dụng công thức khoảng cách ta được $d = \frac{13}{3}$.`;
        }

        qList.push({
          id: code,
          subject: "Toán học & Xử lý số liệu",
          content: content,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : "",
          imageSrc: hasImg ? SAMPLE_VARIATION_TABLE : null,
          options: opts,
          correctIndex: 0,
          solution: sol
        });
      }
      return qList;
    };

    function App() {
      const [view, setView] = useState('student');
      const [adminTab, setAdminTab] = useState('upload_audit');
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState([
        { id: "EXAM-2026-01", name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", passCode: "HSA2026", startTime: "2026-10-25 08:00", fee: "50.000 VNĐ", totalQuestions: 50 }
      ]);

      const [rootQuestions, setRootQuestions] = useState(generate50MathQuestions());

      const [uploadExamCode, setUploadExamCode] = useState("01");
      const [auditSubject, setAuditSubject] = useState("T");
      const [rawTextPasted, setRawTextPasted] = useState("");
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [parsedQuestions, setParsedQuestions] = useState([]);

      const [editingModalOpen, setEditingModalOpen] = useState(false);
      const [currentEditQuestion, setCurrentEditQuestion] = useState(null);

      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);
      const [showPaymentModal, setShowPaymentModal] = useState(false);

      const currentUser = students[currentUserIndex];

      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      // TÁCH CÂU HỎI & CHUẨN HÓA FONT CHỮ / TOÁN HỌC
      const parseQuestionsFromText = (text, examCode) => {
        if (!text || !text.trim()) return;

        // Chuyển mã TCVN3 nếu phát hiện ký tự cũ
        let cleanText = convertTCVN3ToUnicode(text);

        // Chuẩn hóa ký hiệu toán học
        let normalized = cleanText
          .replace(/√\((.*?)\)/g, "$\sqrt{$1}$")
          .replace(/√([a-zA-Z0-9]+)/g, "$\sqrt{$1}$")
          .replace(/²/g, "$^2$")
          .replace(/³/g, "$^3$")
          .replace(/∫/g, "$\int$")
          .replace(/∞/g, "$\infty$")
          .replace(/R/g, "$\mathbb{R}$");

        const parts = normalized.split(/(?=Câu\s*\d+[\s*:\.\-\–])/gi);
        const list = [];
        let order = 1;

        parts.forEach((block) => {
          const clean = block.trim();
          if (clean.length > 10) {
            const numStr = order < 10 ? '0' + order : '' + order;
            const qId = `${auditSubject}${examCode}-${numStr}`;

            let optA = "A. Phương án 1", optB = "B. Phương án 2", optC = "C. Phương án 3", optD = "D. Phương án 4";
            const matchA = clean.match(/A[\.\:\)\s](.*?)(?=B[\.\:\)\s]|$)/s);
            const matchB = clean.match(/B[\.\:\)\s](.*?)(?=C[\.\:\)\s]|$)/s);
            const matchC = clean.match(/C[\.\:\)\s](.*?)(?=D[\.\:\)\s]|$)/s);
            const matchD = clean.match(/D[\.\:\)\s](.*?)(?=$)/s);

            if (matchA && matchB) {
              optA = matchA[1].trim();
              optB = matchB[1].trim();
              optC = matchC ? matchC[1].trim() : "Phương án C";
              optD = matchD ? matchD[1].trim() : "Phương án D";
            }

            let qContent = clean.split(/A[\.\:\)\s]/)[0].trim();
            if (!qContent) qContent = clean;

            const hasImg = qContent.includes("[HINH_ANH]") || qContent.toLowerCase().includes("bảng biến thiên") || qContent.toLowerCase().includes("đồ thị");
            if (hasImg && !qContent.includes("[HINH_ANH]")) {
              qContent = qContent + " [HINH_ANH] ";
            }

            list.push({
              id: qId,
              subject: SUBJECT_LIST.find(s => s.code === auditSubject)?.name || "Toán",
              content: qContent,
              hasImage: hasImg,
              imageCode: `${qId}.png`,
              imageSrc: hasImg ? SAMPLE_VARIATION_TABLE : null,
              options: [optA, optB, optC, optD],
              correctIndex: 0,
              solution: `Lời giải chuẩn xác cho câu ${qId}.`
            });
            order++;
          }
        });

        if (list.length > 0) {
          setParsedQuestions(list);
        } else {
          const qId = `${auditSubject}${examCode}-01`;
          setParsedQuestions([{
            id: qId,
            subject: SUBJECT_LIST.find(s => s.code === auditSubject)?.name || "Toán",
            content: normalized + " [HINH_ANH] ",
            hasImage: true,
            imageCode: `${qId}.png`,
            imageSrc: SAMPLE_VARIATION_TABLE,
            options: ["Phương án A", "Phương án B", "Phương án C", "Phương án D"],
            correctIndex: 0,
            solution: "Lời giải thẩm định độc lập."
          }]);
        }
      };

      // ĐỌC FILE BẰNG ĐÚNG BẢNG MÃ UTF-8
      const handleFileRead = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const codeInput = window.prompt("Nhập Mã Đề cho tệp này (ví dụ: 01, 02):", uploadExamCode);
        const code = codeInput && codeInput.trim() !== "" ? codeInput.trim() : uploadExamCode;
        setUploadExamCode(code);
        setUploadedFileName(file.name);

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          setRawTextPasted(text);
          parseQuestionsFromText(text, code);
        };
        // Luôn đọc với bảng mã UTF-8 để không bị lỗi phông
        reader.readAsText(file, "UTF-8");
      };

      const handleSaveParsedToBank = () => {
        if (parsedQuestions.length === 0) {
          alert("Chưa có câu hỏi nào được bóc tách!");
          return;
        }
        setRootQuestions([...parsedQuestions, ...rootQuestions]);
        alert(`Đã nạp thành công ${parsedQuestions.length} câu hỏi vào Ngân Hàng Đề Gốc!`);
        setParsedQuestions([]);
        setRawTextPasted("");
        setUploadedFileName("");
      };

      const handleAttachImage = (idx, e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const list = [...parsedQuestions];
            list[idx].hasImage = true;
            list[idx].imageSrc = ev.target.result;
            if (!list[idx].content.includes("[HINH_ANH]")) {
              list[idx].content = list[idx].content + " [HINH_ANH] ";
            }
            setParsedQuestions(list);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleOpenEdit = (q) => {
        setCurrentEditQuestion({ ...q, options: [...q.options] });
        setEditingModalOpen(true);
      };

      const handleSaveEdit = () => {
        if (!currentEditQuestion) return;
        setRootQuestions(rootQuestions.map(q => q.id === currentEditQuestion.id ? currentEditQuestion : q));
        setEditingModalOpen(false);
      };

      const handleStartExam = () => {
        if (currentUser.feeStatus !== 'approved' || !currentUser.eligible) {
          alert("BẠN CHƯA ĐỦ ĐIỀU KIỆN! Cần nộp phí và được duyệt.");
          return;
        }
        if (examPasscode.trim() !== exams[0].passCode) {
          alert(`Mật khẩu không đúng! (Mật khẩu: ${exams[0].passCode})`);
          return;
        }
        setCurrentExamQuestions(rootQuestions.slice(0, 50));
        setAnswers({});
        setTimeLeft(75 * 60);
        setExamViolationCount(0);
        setActiveQuestionIdx(0);
        setStudentMode('exam');
      };

      const handleSubmitExam = () => {
        let total = 0;
        currentExamQuestions.forEach((q, idx) => {
          if (answers[idx] === q.correctIndex) total += 1;
        });

        setExamFinishedData({
          total: total,
          questions: currentExamQuestions,
          userAnswers: answers,
          violations: examViolationCount
        });
        setStudentMode('result');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-black text-xl shadow">
                  HSA
                </div>
                <div>
                  <h1 className="font-bold text-lg md:text-xl tracking-tight leading-none">HỆ THỐNG LUYỆN THI ĐÁNH GIÁ NĂNG LỰC</h1>
                  <span className="text-xs text-blue-200">Bản Chuẩn v13 • Đã Khắc Phục Triệt Để Phông Chữ & KaTeX</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="hidden md:flex items-center bg-blue-950/70 px-2 py-1 rounded text-xs">
                  <span className="text-slate-300 mr-2">Đang đóng vai:</span>
                  <select 
                    value={currentUserIndex} 
                    onChange={(e) => setCurrentUserIndex(Number(e.target.value))}
                    className="bg-transparent text-amber-300 font-bold outline-none cursor-pointer"
                  >
                    {students.map((st, i) => (
                      <option key={st.id} value={i} className="text-slate-900">
                        {st.name} ({st.id} - {st.feeStatus === 'approved' ? 'Đã duyệt' : 'Chờ duyệt'})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex bg-blue-950/80 p-1 rounded-lg border border-blue-700/50">
                  <button
                    onClick={() => { setView('student'); setStudentMode('hub'); }}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'student' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Học Viên
                  </button>
                  <button
                    onClick={() => setView('admin')}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Quản Trị
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN */}

                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <InlineMath text={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <h4 className="text-xs font-bold text-slate-700 uppercase mb-3">Mục lục ({currentExamQuestions.length} câu)</h4>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* KẾT QUẢ */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 text-center">
                    <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI THẬT</h2>
                    <div className="inline-block bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                      <span className="text-xs text-blue-700 font-bold uppercase">Điểm Số Đạt Được</span>
                      <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                    </div>
                    <div>
                      <button onClick={() => setStudentMode('hub')} className="px-6 py-2.5 bg-blue-700 text-white font-bold rounded-xl text-xs">
                        Trở về Trang Chủ
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
