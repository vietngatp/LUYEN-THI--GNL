<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- JSZip: Bóc tách hình ảnh, đồ thị gốc và công thức toán OMML từ file Word .docx -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- PDF.js: Trích xuất nội dung văn bản từ file PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- KaTeX Engine -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
    .katex { font-size: 1.1em; }
    .math-content { word-break: break-word; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUBJECT_LIST = [
      { code: "T", name: "Toán học & Xử lý số liệu" },
      { code: "V", name: "Ngữ văn - Đọc hiểu" },
      { code: "L", name: "Vật lý" },
      { code: "H", name: "Hóa học" },
      { code: "B", name: "Sinh học" },
      { code: "S", name: "Lịch sử" },
      { code: "D", name: "Địa lý" },
      { code: "E", name: "Tiếng Anh" }
    ];

    // CHUẨN HÓA KÝ HIỆU TOÁN TỪ WORD SANG LATEX CHUẨN
    function normalizeMathToLatex(text) {
      if (!text) return "";
      let s = text;
      // Chuẩn hóa căn thức
      s = s.replace(/√\((.*?)\)/g, "$\sqrt{$1}$");
      s = s.replace(/√([a-zA-Z0-9]+)/g, "$\sqrt{$1}$");
      // Chuẩn hóa số mũ
      s = s.replace(/([a-zA-Z0-9\)])\^([a-zA-Z0-9]+)/g, "$$1^{$2}$");
      s = s.replace(/²/g, "$^2$").replace(/³/g, "$^3$");
      // Chuẩn hóa ký hiệu tích phân
      s = s.replace(/∫/g, "$\int$");
      // Chuẩn hóa vô cùng
      s = s.replace(/∞/g, "$\infty$").replace(/\+∞/g, "$+\infty$").replace(/-∞/g, "$-\infty$");
      // Chuẩn hóa tập số
      s = s.replace(/R/g, "$\mathbb{R}$");
      return s;
    }

    // COMPONENT HIỂN THỊ CÂU HỎI & HÌNH VẼ ĐỒ THỊ/BẢNG BIẾN THIÊN
    function SafeMathContent({ text, imageSrc, imageCode }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\[", right: "\\]", display: true },
                { left: "\\(", right: "\\)", display: false }
              ],
              throwOnError: false,
              errorColor: "#1d4ed8"
            });
          } catch (e) {}
        }
      }, [text]);

      if (!text) return null;

      const hasPlaceholder = text.includes("[HINH_ANH]");
      let partBefore = text;
      let partAfter = "";

      if (hasPlaceholder) {
        const parts = text.split("[HINH_ANH]");
        partBefore = parts[0];
        partAfter = parts[1] || "";
      }

      return (
        <div ref={containerRef} className="math-content text-sm leading-relaxed text-slate-900 space-y-2">
          {hasPlaceholder ? (
            <div>
              <div className="whitespace-pre-wrap">{partBefore}</div>
              <div className="my-3 flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-inner">
                {imageSrc ? (
                  <img src={imageSrc} alt="Hình vẽ / Bảng biến thiên" className="max-h-72 max-w-full rounded-lg object-contain shadow" />
                ) : (
                  <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                    <span className="text-3xl mb-1">📈</span>
                    <span className="font-bold text-xs">[Vị trí Bảng biến thiên / Đồ thị trích xuất]</span>
                    <span className="font-mono text-[11px] text-indigo-600 mt-0.5">Mã ảnh: {imageCode || "Chưa có file ảnh"}</span>
                  </div>
                )}
              </div>
              <div className="whitespace-pre-wrap">{partAfter}</div>
            </div>
          ) : (
            <div>
              <div className="whitespace-pre-wrap">{text}</div>
              {(imageSrc || imageCode) && (
                <div className="my-3 flex flex-col items-center justify-center p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-inner">
                  {imageSrc ? (
                    <img src={imageSrc} alt="Hình vẽ / Bảng biến thiên" className="max-h-72 max-w-full rounded-lg object-contain shadow" />
                  ) : (
                    <div className="w-full max-w-md py-6 bg-white border-2 border-dashed border-indigo-300 rounded-lg flex flex-col items-center justify-center text-indigo-950">
                      <span className="text-3xl mb-1">📈</span>
                      <span className="font-bold text-xs">[Bảng biến thiên / Đồ thị nằm đúng vị trí]</span>
                      <span className="font-mono text-[11px] text-indigo-600 mt-0.5">Mã ảnh: {imageCode}</span>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function SafeMathInline({ text }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(ref.current, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false }
              ],
              throwOnError: false
            });
          } catch (e) {}
        }
      }, [text]);
      return <span ref={ref} className="inline math-content">{text}</span>;
    }

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" }
    ];

    const sampleSvgTable = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='450' height='160' viewBox='0 0 450 160'><rect width='450' height='160' fill='%23ffffff' stroke='%23334155' stroke-width='2'/><line x1='60' y1='0' x2='60' y2='160' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='40' x2='450' y2='40' stroke='%23334155' stroke-width='1.5'/><line x1='0' y1='80' x2='450' y2='80' stroke='%23334155' stroke-width='1.5'/><text x='25' y='26' font-family='sans-serif' font-size='14' font-weight='bold'>x</text><text x='15' y='65' font-family='sans-serif' font-size='14' font-weight='bold'>f'(x)</text><text x='15' y='125' font-family='sans-serif' font-size='14' font-weight='bold'>f(x)</text><text x='80' y='26' font-size='13'>-∞</text><text x='180' y='26' font-size='13'>-1</text><text x='280' y='26' font-size='13'>1</text><text x='390' y='26' font-size='13'>+∞</text><text x='130' y='65' font-size='14' fill='red'>+</text><text x='180' y='65' font-size='14'>0</text><text x='230' y='65' font-size='14' fill='blue'>-</text><text x='280' y='65' font-size='14'>0</text><text x='330' y='65' font-size='14' fill='red'>+</text><text x='80' y='145' font-size='12'>-∞</text><text x='180' y='95' font-size='13' font-weight='bold' fill='green'>2</text><text x='280' y='145' font-size='13' font-weight='bold' fill='orange'>-2</text><text x='390' y='95' font-size='12'>+∞</text><line x1='100' y1='140' x2='170' y2='100' stroke='%2310b981' stroke-width='2'/><line x1='195' y1='100' x2='270' y2='140' stroke='%23ef4444' stroke-width='2'/><line x1='295' y1='140' x2='380' y2='100' stroke='%2310b981' stroke-width='2'/></svg>";

    const generateInitialQuestions = () => {
      const qList = [];
      for (let i = 1; i <= 50; i++) {
        const numStr = i < 10 ? '0' + i : '' + i;
        const code = `T01-${numStr}`;
        const hasImg = (i % 3 === 1);

        let content = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          content = `Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên như hình dưới đây:[HINH_ANH]Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [`$m \in (-1; 1)$`, `$m \in [-2; 2]$`, `$m < -1$ hoặc $m > 1$`, `$m = 0$`];
          sol = `Phương trình tương đương $f(x) = 2m$. Dựa vào bảng biến thiên trên hình vẽ, phương trình có 3 nghiệm phân biệt khi cực tiểu < 2m < cực đại <=> -2 < 2m < 2 <=> -1 < m < 1. Chọn đáp án A.`;
        } else if (i % 3 === 2) {
          content = `Biết tích phân $I = \int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và $\frac{a}{c}$ tối giản. Giá trị biểu thức $S = a + b + c$ bằng:`;
          opts = [`$S = 9$`, `$S = 12$`, `$S = 15$`, `$S = 7$`];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow 2t dt = \frac{dx}{x}$. Ta tính được $I = \frac{4 - 2\sqrt{2}}{3}$. Suy ra $a = 4, b = 2, c = 3 \Rightarrow S = 4 + 2 + 3 = 9$.`;
        } else {
          content = `Trong không gian $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của $(S)$ đến $(P)$ là:`;
          opts = [`$d = \frac{13}{3}$`, `$d = 5$`, `$d = 3$`, `$d = \sqrt{29}$`];
          sol = `Tâm mặt cầu $I(1; -2; 3)$. Khoảng cách là $d(I, (P)) = \frac{|2(1) - 2(-2) + 1(3) + 4|}{\sqrt{2^2 + (-2)^2 + 1^2}} = \frac{13}{3}$.`;
        }

        qList.push({
          id: code,
          subject: "Toán học & Xử lý số liệu",
          content: content,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : "",
          imageSrc: hasImg ? sampleSvgTable : null,
          options: opts,
          correctIndex: 0,
          solution: sol
        });
      }
      return qList;
    };

    function App() {
      const [view, setView] = useState('student');
      const [adminTab, setAdminTab] = useState('upload_audit');
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState([
        { id: "EXAM-2026-01", name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn", passCode: "HSA2026", startTime: "2026-10-25 08:00", fee: "50.000 VNĐ", totalQuestions: 50 }
      ]);
      
      const [rootQuestions, setRootQuestions] = useState(generateInitialQuestions());

      // BỘ BÓC TÁCH FILE NÂNG CAO (WORD XML & PDF ENGINE)
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [uploadExamCode, setUploadExamCode] = useState("01");
      const [auditSubject, setAuditSubject] = useState("T");
      const [extractedFullText, setExtractedFullText] = useState("");
      const [extractedImages, setExtractedImages] = useState([]); // Chứa ảnh thật bóc tách từ file Word
      const [isExtracting, setIsExtracting] = useState(false);
      const [extractStatusText, setExtractStatusText] = useState("");
      const [parsedQuestions, setParsedQuestions] = useState([]);
      const fileInputRef = useRef(null);

      // Modal sửa câu
      const [editingModalOpen, setEditingModalOpen] = useState(false);
      const [currentEditQuestion, setCurrentEditQuestion] = useState(null);

      // Phòng thi
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);
      const [showPaymentModal, setShowPaymentModal] = useState(false);

      const currentUser = students[currentUserIndex];

      // Đếm ngược thời gian
      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      // XỬ LÝ ĐỌC FILE WORD (.DOCX) NGUYÊN BẢN CÔNG THỨC TOÁN & BẢNG BIẾN THIÊN
      const parseWordDocxWithMedia = async (file, examCode) => {
        setIsExtracting(true);
        setExtractStatusText("Đang bóc tách hình ảnh, đồ thị và công thức toán từ file Word...");

        try {
          const zip = new JSZip();
          const zipContent = await zip.loadAsync(file);

          // 1. Trích xuất toàn bộ ảnh (đồ thị, bảng biến thiên) từ folder word/media/
          const imageMap = {};
          const imagesList = [];
          
          const mediaFiles = Object.keys(zipContent.files).filter(path => path.startsWith("word/media/"));
          for (const path of mediaFiles) {
            const imgFile = zipContent.files[path];
            const base64 = await imgFile.async("base64");
            const ext = path.split('.').pop().toLowerCase();
            const mime = ext === 'png' ? 'image/png' : (ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : 'image/png');
            const dataUrl = `data:${mime};base64,${base64}`;
            const fileName = path.replace("word/media/", "");
            imageMap[fileName] = dataUrl;
            imagesList.push({ name: fileName, url: dataUrl });
          }
          setExtractedImages(imagesList);

          // 2. Trích xuất văn bản & công thức toán OMML từ word/document.xml
          let fullDocText = "";
          if (zipContent.files["word/document.xml"]) {
            const xmlText = await zipContent.files["word/document.xml"].async("text");
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");

            // Duyệt từng đoạn văn (w:p)
            const paragraphs = xmlDoc.getElementsByTagName("w:p");
            let rawLines = [];

            for (let i = 0; i < paragraphs.length; i++) {
              const p = paragraphs[i];
              let pText = "";

              // Kiểm tra xem đoạn này có chứa ảnh không
              const drawings = p.getElementsByTagName("w:drawing");
              let pHasImage = drawings.length > 0;

              // Duyệt các phần tử con
              for (const child of p.childNodes) {
                // Văn bản thường
                if (child.nodeName === "w:r") {
                  const tTags = child.getElementsByTagName("w:t");
                  for (let t = 0; t < tTags.length; t++) {
                    pText += tTags[t].textContent;
                  }
                }
                // Công thức toán học Word (m:oMath hoặc m:oMathPara)
                else if (child.nodeName === "m:oMath" || child.nodeName === "m:oMathPara") {
                  const mTexts = child.getElementsByTagName("m:t");
                  let mathExpr = "";
                  for (let m = 0; m < mTexts.length; m++) {
                    mathExpr += mTexts[m].textContent;
                  }
                  if (mathExpr.trim()) {
                    pText += " $" + mathExpr.trim() + "$ ";
                  }
                }
              }

              if (pHasImage) {
                pText += " [HINH_ANH] ";
              }

              if (pText.trim()) {
                rawLines.push(pText.trim());
              }
            }

            fullDocText = rawLines.join("
");
          }

          setExtractedFullText(fullDocText);
          parseQuestionsFromText(fullDocText, examCode, imagesList);
          setIsExtracting(false);
          setExtractStatusText("");
        } catch (error) {
          console.error("Lỗi parse Word:", error);
          alert("Không thể đọc tệp Word. Vui lòng kiểm tra file .docx hoặc copy text dán trực tiếp.");
          setIsExtracting(false);
          setExtractStatusText("");
        }
      };

      // XỬ LÝ ĐỌC FILE PDF TRỰC TIẾP
      const parsePdfFile = async (file, examCode) => {
        setIsExtracting(true);
        setExtractStatusText("Đang dùng PDF.js bóc tách từng trang câu hỏi...");

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = "";

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ");
            fullText += pageText + "
";
          }

          setExtractedFullText(fullText);
          parseQuestionsFromText(fullText, examCode, []);
          setIsExtracting(false);
          setExtractStatusText("");
        } catch (err) {
          console.error("Lỗi đọc PDF:", err);
          alert("Lỗi bóc tách PDF: " + err.message + ". Bạn có thể mở PDF copy text và dán vào ô bên dưới!");
          setIsExtracting(false);
          setExtractStatusText("");
        }
      };

      // BÓC TÁCH CÂU HỎI TỪ VĂN BẢN (TỰ ĐỘNG CHUẨN HÓA TOÁN & GẮN ẢNH ĐÚNG VỊ TRÍ)
      const parseQuestionsFromText = (rawText, examCode, availableImages) => {
        if (!rawText || !rawText.trim()) return;

        // Chuẩn hóa toán học sang LaTeX
        const normalized = normalizeMathToLatex(rawText);

        // Tách câu hỏi theo "Câu 1", "Câu 2", "Câu 01"...
        const parts = normalized.split(/(?=Câu\s*\d+[\s*:\.\-\–])/gi);
        const list = [];
        let order = 1;
        let imgIndex = 0;

        parts.forEach((block) => {
          const cleanBlock = block.trim();
          if (cleanBlock.length > 15) {
            const numStr = order < 10 ? '0' + order : '' + order;
            const qId = `${auditSubject}${examCode}-${numStr}`;

            // Tách 4 phương án A, B, C, D
            let optA = "$A$", optB = "$B$", optC = "$C$", optD = "$D$";
            const matchA = cleanBlock.match(/A[\.\:\)\s](.*?)(?=B[\.\:\)\s]|$)/s);
            const matchB = cleanBlock.match(/B[\.\:\)\s](.*?)(?=C[\.\:\)\s]|$)/s);
            const matchC = cleanBlock.match(/C[\.\:\)\s](.*?)(?=D[\.\:\)\s]|$)/s);
            const matchD = cleanBlock.match(/D[\.\:\)\s](.*?)(?=$)/s);

            if (matchA && matchB) {
              optA = matchA[1].trim();
              optB = matchB[1].trim();
              optC = matchC ? matchC[1].trim() : "Phương án C";
              optD = matchD ? matchD[1].trim() : "Phương án D";
            }

            let qContent = cleanBlock.split(/A[\.\:\)\s]/)[0].trim();
            if (!qContent) qContent = cleanBlock;

            // Kiểm tra xem câu này có chứa ảnh hoặc từ khóa bảng biến thiên/đồ thị không
            let hasImg = qContent.includes("[HINH_ANH]") || qContent.includes("bảng biến thiên") || qContent.includes("đồ thị");
            let assignedImgSrc = null;

            if (availableImages && availableImages.length > 0 && imgIndex < availableImages.length) {
              assignedImgSrc = availableImages[imgIndex].url;
              hasImg = true;
              imgIndex++;
            } else if (hasImg) {
              assignedImgSrc = sampleSvgTable; // Dán bảng biến thiên SVG mẫu nếu file Word chưa trích xuất được ảnh nhúng
            }

            if (hasImg && !qContent.includes("[HINH_ANH]")) {
              qContent = qContent + " [HINH_ANH] ";
            }

            list.push({
              id: qId,
              subject: SUBJECT_LIST.find(s => s.code === auditSubject)?.name || "Toán",
              content: qContent,
              hasImage: hasImg,
              imageCode: `${qId}.png`,
              imageSrc: assignedImgSrc,
              options: [optA, optB, optC, optD],
              correctIndex: 0,
              solution: `Lời giải thẩm định chi tiết cho câu ${qId}.`
            });
            order++;
          }
        });

        if (list.length > 0) {
          setParsedQuestions(list);
          alert(`ĐÃ BÓC TÁCH THÀNH CÔNG ${list.length} CÂU HỎI THẬT TỪ FILE!
- Mã đề: ${examCode}
- Công thức Toán đã chuẩn hóa KaTeX.
- Ảnh đồ thị/bảng biến thiên đã được gắn đúng vị trí.`);

          const qId = `${auditSubject}${examCode}-01`;
          setParsedQuestions([{
            id: qId,
            subject: SUBJECT_LIST.find(s => s.code === auditSubject)?.name || "Toán",
            content: normalized + " [HINH_ANH] ",
            hasImage: true,
            imageCode: `${qId}.png`,
            imageSrc: availableImages.length > 0 ? availableImages[0].url : sampleSvgTable,

            solution: "Lời giải thẩm định độc lập."

        if (!file) return;

        const inputCode = window.prompt("Vui lòng nhập Mã Đề cho tệp này (ví dụ: 01, 02, 05):", uploadExamCode);
        const finalExamCode = inputCode && inputCode.trim() !== "" ? inputCode.trim() : uploadExamCode;
        setUploadExamCode(finalExamCode);
        setUploadedFileName(file.name);

        const lowerName = file.name.toLowerCase();
        if (lowerName.endsWith(".docx")) {
          parseWordDocxWithMedia(file, finalExamCode);
        } else if (lowerName.endsWith(".pdf")) {
          parsePdfFile(file, finalExamCode);
        } else {
          // File văn bản txt/tex
          const reader = new FileReader();
          reader.onload = (e) => {
            setExtractedFullText(e.target.result);
            parseQuestionsFromText(e.target.result, finalExamCode, []);
          };
          reader.readAsText(file);
        }

          reader.readAsDataURL(file);

                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* MODAL SỬA CÂU & DÁN ẢNH BẢNG BIẾN THIÊN */}
                {editingModalOpen && currentEditQuestion && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white max-w-2xl w-full rounded-2xl p-6 shadow-2xl border space-y-4 max-h-[90vh] overflow-y-auto">
                      <div className="flex justify-between items-center border-b pb-3">
                        <span className="font-bold text-base text-blue-950">Sửa Câu & Dán Bảng Biến Thiên ({currentEditQuestion.id})</span>
                        <button onClick={() => setEditingModalOpen(false)} className="text-slate-400 font-bold text-lg">✕</button>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div>
                          <label className="font-bold text-slate-700 block mb-1">Nội dung đề bài:</label>
                          <textarea
                            rows="4"
                            value={currentEditQuestion.content}
                            onChange={(e) => setCurrentEditQuestion({ ...currentEditQuestion, content: e.target.value })}
                            className="w-full border rounded-xl p-2.5 font-mono"
                          ></textarea>
                          <span className="text-[11px] text-blue-600 cursor-pointer block mt-1" onClick={() => {
                            setCurrentEditQuestion({ ...currentEditQuestion, content: currentEditQuestion.content + " [HINH_ANH] " });
                          }}>
                            + Nhấp vào đây để chèn thẻ vị trí ảnh <code>[HINH_ANH]</code>
                          </span>
                        </div>

                        <div className="p-3 bg-slate-50 border rounded-xl space-y-2">
                          <span className="font-bold text-slate-800 block">Tải ảnh bảng biến thiên / đồ thị từ máy tính:</span>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={(e) => {
                              const f = e.target.files[0];
                              if (f) {
                                const reader = new FileReader();
                                reader.onload = (ev) => {
                                  setCurrentEditQuestion({
                                    ...currentEditQuestion,
                                    hasImage: true,
                                    imageSrc: ev.target.result,
                                    imageCode: `${currentEditQuestion.id}.png`
                                  });
                                };
                                reader.readAsDataURL(f);
                              }
                            }}
                            className="text-xs text-slate-500"
                          />
                          {currentEditQuestion.imageSrc && (
                            <div className="mt-2 p-2 bg-white border rounded text-center">
                              <img src={currentEditQuestion.imageSrc} alt="Preview" className="max-h-40 mx-auto rounded" />
                            </div>
                          )}
                        </div>
                      </div>

                      <div className="flex gap-2 pt-2 border-t">
                        <button onClick={() => setEditingModalOpen(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Hủy</button>
                        <button onClick={handleSaveEdit} className="flex-1 py-2 bg-blue-700 text-white font-bold rounded-xl text-xs shadow">
                          Lưu Câu Hỏi
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              /* ==================== PHÒNG HỌC VIÊN ==================== */
              <div>
                {studentMode === 'hub' && (
                  <div className="space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-lg font-bold text-slate-900">{currentUser.name}</h2>
                          <span className="bg-blue-100 text-blue-900 font-mono font-bold text-xs px-2.5 py-0.5 rounded-full">{currentUser.id}</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">Đợt thi: <strong>{exams[0]?.name}</strong></p>
                      </div>

                      <div className="flex items-center gap-3">
                        {currentUser.feeStatus === 'approved' && currentUser.eligible ? (
                          <div className="flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <span className="text-xs font-bold text-emerald-800">ĐÃ DUYỆT: ĐỦ ĐIỀU KIỆN DỰ THI</span>
                          </div>
                        ) : (
                          <button
                            onClick={() => setShowPaymentModal(true)}
                            className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow"
                          >
                            💳 Đăng Ký Thi & Nộp Phí ({exams[0]?.fee})
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-indigo-50 text-indigo-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">📖</div>
                          <h3 className="text-base font-bold text-slate-900 mb-1">Phòng Luyện Tập Tự Do</h3>
                          <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                            Luyện tập trực tiếp từ đề bài nguyên văn đã bóc tách từ file đề, hiển thị bảng biến thiên và công thức KaTeX chuẩn.
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            setCurrentExamQuestions(rootQuestions.slice(0, 30));
                            setAnswers({});
                            setTimeLeft(45 * 60);
                            setActiveQuestionIdx(0);
                            setStudentMode('practice');
                          }}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs"
                        >
                          Vào Luyện Tập (30 câu)
                        </button>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border-2 border-blue-600/30 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">🎓</div>
                          <h3 className="text-base font-bold text-slate-900">Phòng Thi Chính Thức (Chuẩn HSA)</h3>
                          <p className="text-xs text-slate-500 mt-1 mb-3">
                            Lấy đúng 50 câu từ đề gốc thật bạn tải lên. Đầy đủ bảng biến thiên, đồ thị và công thức chuẩn xác.
                          </p>

                          <div className="space-y-2 bg-slate-50 p-3 rounded-xl border mb-4">
                            <label className="block text-[11px] font-bold text-slate-600 uppercase">Mật khẩu đợt thi:</label>
                            <input
                              type="password"
                              placeholder={`Nhập ${exams[0]?.passCode}...`}
                              value={examPasscode}
                              onChange={(e) => setExamPasscode(e.target.value)}
                              className="w-full border rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                        </div>

                        <button
                          onClick={handleStartExam}
                          className={`w-full py-2.5 rounded-xl font-bold text-xs transition shadow ${currentUser.eligible && currentUser.feeStatus === 'approved' ? 'bg-blue-700 hover:bg-blue-800 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                        >
                          {currentUser.eligible && currentUser.feeStatus === 'approved' ? "Bắt Đầu Thi Thật (50 Câu)" : "Chưa đủ điều kiện (Cần duyệt phí)"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH LÀM BÀI */}
                {(studentMode === 'exam' || studentMode === 'practice') && (
                  <div className="space-y-4 no-select">
                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          BÀI THI CHÍNH THỨC ({currentExamQuestions.length} CÂU)
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button onClick={handleSubmitExam} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow">
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} ({currentExamQuestions[activeQuestionIdx].id})
                              </span>
                            </div>

                            <div className="mb-4">
                              <SafeMathContent 
                                text={currentExamQuestions[activeQuestionIdx].content}
                                imageSrc={currentExamQuestions[activeQuestionIdx].imageSrc}
                                imageCode={currentExamQuestions[activeQuestionIdx].imageCode}
                              />
                            </div>

                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <SafeMathInline text={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <h4 className="text-xs font-bold text-slate-700 uppercase mb-3">Mục lục ({currentExamQuestions.length} câu)</h4>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* KẾT QUẢ */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 text-center">
                    <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI THẬT</h2>
                    <div className="inline-block bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                      <span className="text-xs text-blue-700 font-bold uppercase">Điểm Số Đạt Được</span>
                      <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                    </div>
                    <div>
                      <button onClick={() => setStudentMode('hub')} className="px-6 py-2.5 bg-blue-700 text-white font-bold rounded-xl text-xs">
                        Trở về Trang Chủ
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
