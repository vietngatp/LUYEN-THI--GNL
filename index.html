<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- MathJax để hiển thị công thức toán học nguyên vẹn 100% -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Component hiển thị công thức Toán và Nội dung nguyên vẹn
    function MathRender({ content }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (window.MathJax && window.MathJax.typesetPromise && containerRef.current) {
          window.MathJax.typesetPromise([containerRef.current]).catch((err) => console.log('MathJax error:', err));
        }
      }, [content]);

      return <div ref={containerRef} className="leading-relaxed whitespace-pre-wrap">{content}</div>;
    }

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" },
      { id: "07-TP-003", name: "Lê Hoàng Long", birthYear: "2007", classUnit: "TP", email: "long.le@example.com", eligible: false, feeStatus: "unregistered", regTime: "-" }
    ];

    // SINH 50 CÂU TOÁN CHUẨN HSA VỚI CÔNG THỨC TOÁN LATEX & ĐỒ THỊ NGUYÊN VẸN 100%
    const generate50MathQuestions = () => {
      const topics = [
        "Khảo sát hàm số & Ứng dụng đạo hàm",
        "Hàm số Mũ - Logarit & Bất phương trình",
        "Nguyên hàm - Tích phân & Ứng dụng",
        "Hình học không gian Oxyz & Tọa độ",
        "Thống kê mẫu số liệu & Xác suất cổ điển",
        "Cấp số cộng, Cấp số nhân & Dãy số"
      ];
      
      const qList = [];
      for (let i = 1; i <= 50; i++) {
        const topic = topics[(i - 1) % topics.length];
        const lvl = i <= 13 ? "B" : (i <= 28 ? "H" : (i <= 43 ? "VD" : "VDC"));
        const code = `T10-01-${i < 10 ? '0' + i : i}`;
        const hasImg = (i % 3 === 1);
        
        let rawContent = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          rawContent = `Cho hàm số bậc ba $y = f(x) = ax^3 + bx^2 + cx + d$ $(a \ne 0)$ có đồ thị như hình vẽ bên. Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [
            `$m \in (-2; 2)$`,
            `$m \in [-1; 3]$`,
            `$m < -2$ hoặc $m > 2$`,
            `$m = 0$`
          ];
          sol = `Phương trình tương đương $f(x) = 2m$. Số nghiệm của phương trình là số giao điểm của đồ thị hàm số $y = f(x)$ và đường thẳng $y = 2m$. Dựa vào đồ thị nguyên gốc, yêu cầu bài toán tương đương $-4 < 2m < 4 \Leftrightarrow -2 < m < 2$. Chọn đáp án A.`;
        } else if (i % 3 === 2) {
          rawContent = `Biết rằng tích phân $\int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} \, dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và $\frac{a}{c}$ là phân số tối giản. Tính giá trị biểu thức $S = a + b + c$.`;
          opts = [
            `$S = 19$`,
            `$S = 23$`,
            `$S = 15$`,
            `$S = 27$`
          ];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow t^2 = 1 + \ln x \Rightarrow 2t dt = \frac{dx}{x}$ và $\ln x = t^2 - 1$. Đổi cận: $x = 1 \Rightarrow t = 1$; $x = e \Rightarrow t = \sqrt{2}$. Khi đó $I = \int_{1}^{\sqrt{2}} \frac{t^2 - 1}{t} \cdot 2t \, dt = 2 \int_{1}^{\sqrt{2}} (t^2 - 1) dt = \frac{4 - 2\sqrt{2}}{3}$. Suy ra $a = 4, b = 2, c = 3 \Rightarrow S = 4 + 2 + 3 = 9$.`;
        } else {
          rawContent = `Trong không gian với hệ tọa độ $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của mặt cầu $(S)$ đến mặt phẳng $(P)$ là:`;
          opts = [
            `$d(I, (P)) = 5$`,
            `$d(I, (P)) = 3$`,
            `$d(I, (P)) = \sqrt{29}$`,
            `$d(I, (P)) = \frac{13}{3}$`
          ];
          sol = `Tâm mặt cầu là $I(1; -2; 3)$. Khoảng cách là $d(I, (P)) = \frac{|2(1) - 2(-2) + 1(3) + 4|}{\sqrt{2^2 + (-2)^2 + 1^2}} = \frac{|2 + 4 + 3 + 4|}{3} = \frac{13}{3}$. Chọn đáp án D.`;
        }

        qList.push({
          id: code,
          subject: "Toán",
          topic: topic,
          level: lvl,
          part: "math",
          content: rawContent,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : null,
          options: opts,
          correctIndex: 0,
          solution: sol,
          status: "approved"
        });
      }
      return qList;
    };

    const generatePracticeQuestions = (mathList) => {
      const pList = [];
      mathList.slice(0, 15).forEach((q) => {
        for (let k = 1; k <= 3; k++) {
          pList.push({
            id: `${q.id}${k}`,
            rootId: q.id,
            subject: q.subject,
            topic: q.topic,
            level: q.level,
            content: `[Câu phái sinh ${k} từ ${q.id}]: Giữ nguyên dạng toán, thay đổi tham số: ${q.content}`,
            hasImage: q.hasImage,
            imageCode: q.imageCode,
            options: q.options,
            correctIndex: (q.correctIndex + k) % 4,
            solution: `Lời giải thẩm định chi tiết cho câu phái sinh ${q.id}${k}: Áp dụng cùng phương pháp giải của câu gốc ${q.id}.`,
            status: "approved"
          });
        }
      });
      return pList;
    };

    const INITIAL_MATH_50 = generate50MathQuestions();
    const INITIAL_PRACTICE = generatePracticeQuestions(INITIAL_MATH_50);

    const INITIAL_EXAMS = [
      { 
        id: "EXAM-2026-01", 
        name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", 
        passCode: "HSA2026", 
        startTime: "2026-10-25 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 50,
        active: true 
      }
    ];

    function App() {
      const [view, setView] = useState('student');
      const [adminTab, setAdminTab] = useState('root_bank'); // 'root_bank', 'practice_bank', 'exam_creator', 'ai_audit', 'students'
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState(INITIAL_EXAMS);
      
      // Ngân hàng đề gốc và Ngân hàng luyện tập
      const [rootQuestions, setRootQuestions] = useState(INITIAL_MATH_50);
      const [practiceQuestions, setPracticeQuestions] = useState(INITIAL_PRACTICE);

      // Thẩm định đề & Upload
      const [uploadedFileName, setUploadedFileName] = useState("");
      const [exactQuestionText, setExactQuestionText] = useState("");
      const [exactOptA, setExactOptA] = useState("");
      const [exactOptB, setExactOptB] = useState("");
      const [exactOptC, setExactOptC] = useState("");
      const [exactOptD, setExactOptD] = useState("");
      const [exactSolution, setExactSolution] = useState("");
      const [hasGraphOrTable, setHasGraphOrTable] = useState(false);
      const [imagePreviewUrl, setImagePreviewUrl] = useState("");
      const [editingQuestion, setEditingQuestion] = useState(null);

      // Phòng thi
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      // Modal thanh toán
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      const currentUser = students[currentUserIndex];

      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      useEffect(() => {
        if (studentMode !== 'exam') return;
        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const next = c + 1;
              if (next >= 3) {
                alert("CẢNH BÁO VI PHẠM: Bạn rời màn hình thi quá 3 lần! Bài thi tự động thu.");
                handleSubmitExam();
              }
              return next;
            });
          }
        };
        const handleBlur = () => setExamViolationCount(c => c + 1);
        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);
        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // Xử lý nạp nguyên vẹn 100% vào Ngân hàng Đề Gốc
      const handleImportExactQuestion = () => {
        if (!exactQuestionText.trim()) {
          alert("Vui lòng nhập nội dung nguyên văn câu hỏi đề gốc!");
          return;
        }

        const newId = `T10-01-${rootQuestions.length + 1 < 10 ? '0' + (rootQuestions.length + 1) : rootQuestions.length + 1}`;
        const newImgCode = hasGraphOrTable ? `${newId}.png` : null;

        const importedRootQuestion = {
          id: newId,
          subject: "Toán",
          topic: "CT GDPT 2018 (Nguyên văn đề gốc)",
          level: "VD",
          part: "math",
          content: exactQuestionText, // Nguyên vẹn 100%
          hasImage: hasGraphOrTable,
          imageCode: newImgCode,
          options: [
            exactOptA || "Phương án A nguyên bản",
            exactOptB || "Phương án B nguyên bản",
            exactOptC || "Phương án C nguyên bản",
            exactOptD || "Phương án D nguyên bản"
          ],
          correctIndex: 0,
          solution: exactSolution || "Lời giải chuẩn xác 100% từ hội đồng chuyên gia thẩm định.",
          status: "approved"
        };

        // Sinh 3 câu phái sinh giữ nguyên hình ảnh hoặc ma trận kiến thức
        const v1 = {
          id: `${newId}1`,
          rootId: newId,
          subject: "Toán",
          topic: "CT GDPT 2018",
          level: "VD",
          content: `[Phái sinh 1 từ ${newId}]: ${exactQuestionText.replace("Tìm tất cả", "Xác định số lượng")}`,
          hasImage: hasGraphOrTable,
          imageCode: newImgCode,
          options: importedRootQuestion.options,
          correctIndex: 1,
          solution: `Lời giải câu phái sinh 1 kế thừa từ ${newId}.`,
          status: "approved"
        };
        const v2 = { ...v1, id: `${newId}2`, content: `[Phái sinh 2 từ ${newId}]: Biến thể cùng chuyên đề và độ khó tương đương.` };
        const v3 = { ...v1, id: `${newId}3`, content: `[Phái sinh 3 từ ${newId}]: Mở rộng câu hỏi theo ma trận GDPT 2018.` };

        setRootQuestions([importedRootQuestion, ...rootQuestions]);
        setPracticeQuestions([v1, v2, v3, ...practiceQuestions]);

        alert(`ĐÃ CHUYỂN NGUYÊN VẸN 100% VÀO NGÂN HÀNG ĐỀ GỐC!
- Mã câu: ${newId}
- Đối tượng hình vẽ/đồ thị: ${newImgCode ? newImgCode : 'Không có'}
- Đã đồng thời sinh 3 câu phái sinh vào Ngân Hàng Luyện Tập!`);
        
        // Reset form
        setExactQuestionText("");
        setExactOptA("");
        setExactOptB("");
        setExactOptC("");
        setExactOptD("");
        setExactSolution("");
        setHasGraphOrTable(false);
        setUploadedFileName("");
      };

      const handleStartExam = () => {
        if (currentUser.feeStatus !== 'approved' || !currentUser.eligible) {
          alert("BẠN CHƯA ĐỦ ĐIỀU KIỆN DỰ THI! Vui lòng nộp lệ phí và chờ Quản trị viên phê duyệt.");
          return;
        }
        if (examPasscode.trim() !== exams[0].passCode) {
          alert(`Mật khẩu đợt thi không chính xác! (Mật khẩu: ${exams[0].passCode})`);
          return;
        }

        // Bốc đủ 50 câu Toán nguyên bản từ Ngân hàng Đề Gốc
        const full50 = rootQuestions.filter(q => q.subject === "Toán").slice(0, 50);
        setCurrentExamQuestions(full50);
        setAnswers({});
        setTimeLeft(75 * 60);
        setExamViolationCount(0);
        setActiveQuestionIdx(0);
        setStudentMode('exam');
      };

      const handleSubmitExam = () => {
        let total = 0;
        currentExamQuestions.forEach((q, idx) => {
          if (answers[idx] === q.correctIndex) total += 1;
        });

        setExamFinishedData({
          total: total,
          questions: currentExamQuestions,
          userAnswers: answers,
          violations: examViolationCount
        });
        setStudentMode('result');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-black text-xl shadow">
                  HSA
                </div>
                <div>
                  <h1 className="font-bold text-lg md:text-xl tracking-tight leading-none">HỆ THỐNG LUYỆN THI ĐÁNH GIÁ NĂNG LỰC</h1>
                  <span className="text-xs text-blue-200">ĐHQGHN • Giữ Nguyên Bản 100% Đề Gốc • Công Thức & Đồ Thị Chuẩn</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="hidden md:flex items-center bg-blue-950/70 px-2 py-1 rounded text-xs">
                  <span className="text-slate-300 mr-2">Đang đóng vai:</span>
                  <select 
                    value={currentUserIndex} 
                    onChange={(e) => setCurrentUserIndex(Number(e.target.value))}
                    className="bg-transparent text-amber-300 font-bold outline-none cursor-pointer"
                  >
                    {students.map((st, i) => (
                      <option key={st.id} value={i} className="text-slate-900">
                        {st.name} ({st.id} - {st.feeStatus === 'approved' ? 'Đã duyệt' : st.feeStatus === 'pending' ? 'Chờ duyệt' : 'Chưa nộp'})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex bg-blue-950/80 p-1 rounded-lg border border-blue-700/50">
                  <button
                    onClick={() => { setView('student'); setStudentMode('hub'); }}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'student' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Học Viên
                  </button>
                  <button
                    onClick={() => setView('admin')}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Quản Trị
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {view === 'admin' ? (
              /* ==================== PHÒNG QUẢN TRỊ ==================== */
              <div className="space-y-6">
                {/* MENU QUẢN TRỊ */}
                <div className="bg-white p-2 rounded-2xl shadow-sm border flex flex-wrap gap-2">
                  <button
                    onClick={() => setAdminTab('root_bank')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'root_bank' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📚 1. Ngân Hàng Đề Gốc ({rootQuestions.length} câu nguyên bản)
                  </button>
                  <button
                    onClick={() => setAdminTab('practice_bank')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'practice_bank' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    🎯 2. Ngân Hàng Luyện Tập ({practiceQuestions.length} câu)
                  </button>
                  <button
                    onClick={() => setAdminTab('import_exact')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'import_exact' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    📥 3. Nạp Câu Hỏi Nguyên Vẹn 100% & Thẩm Định
                  </button>
                  <button
                    onClick={() => setAdminTab('students')}
                    className={`px-3 py-2 text-xs md:text-sm font-bold rounded-xl transition ${adminTab === 'students' ? 'bg-blue-800 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}`}
                  >
                    👥 4. Duyệt Lệ Phí & Bật Quyền Thi
                  </button>
                </div>

                {/* 1. NGÂN HÀNG ĐỀ GỐC NGUYÊN VẸN 100% */}
                {adminTab === 'root_bank' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <div className="flex flex-col md:flex-row md:items-center justify-between border-b pb-4 gap-2">
                      <div>
                        <h2 className="text-lg font-bold text-blue-950">Ngân Hàng Đề Gốc (Giữ Nguyên Bản 100% Câu Chữ, Công Thức & Đồ Thị)</h2>
                        <p className="text-xs text-slate-500">Toàn bộ câu hỏi gốc được lưu trữ nguyên trạng. Khi thi, hệ thống bốc trực tiếp từ đây để hiển thị đúng tuyệt đối cho học viên.</p>
                      </div>
                      <span className="bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full text-xs">
                        Đang lưu trữ: {rootQuestions.length} câu gốc chuẩn
                      </span>
                    </div>

                    <div className="space-y-4 max-h-[650px] overflow-y-auto pr-2">
                      {rootQuestions.map((q) => (
                        <div key={q.id} className="p-4 bg-slate-50 border rounded-2xl hover:border-blue-400 transition text-xs space-y-3">
                          <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2">
                              <span className="font-mono font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-lg">{q.id}</span>
                              <span className="font-bold text-slate-700">{q.subject}</span>
                              <span className="text-slate-500">• {q.topic}</span>
                              <span className="bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded text-[11px]">Mức: {q.level}</span>
                              {q.hasImage && (
                                <span className="bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-mono text-[11px] font-bold">
                                  🖼️ Ảnh đồ thị: {q.imageCode}
                                </span>
                              )}
                            </div>
                            <div className="flex gap-2">
                              <button
                                onClick={() => {
                                  setRootQuestions(rootQuestions.filter(item => item.id !== q.id));
                                  alert(`Đã xóa câu hỏi ${q.id} khỏi ngân hàng gốc!`);
                                }}
                                className="text-rose-600 hover:text-rose-800 font-semibold px-2.5 py-1 border border-rose-200 rounded-lg bg-white"
                              >
                                🗑️ Xóa

                          className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                        >
                          Xác Nhận Đã Chuyển Tiền
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH LÀM BÀI NGUYÊN VẸN 100% */}
                {(studentMode === 'exam' || studentMode === 'practice') && (
                  <div className="space-y-4 no-select">
                    {studentMode === 'exam' && examViolationCount > 0 && (
                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center">
                        <span className="font-bold">⚠️ RỜI MÀN HÌNH {examViolationCount}/3 LẦN! (Quá 3 lần sẽ tự động thu bài).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? `ĐỢT THI CHÍNH THỨC (${currentExamQuestions.length} CÂU NGUYÊN BẢN)` : `BÀI LUYỆN TẬP (${currentExamQuestions.length} CÂU)`}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button
                          onClick={handleSubmitExam}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow"
                        >
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      {/* Nội dung câu hỏi giữ nguyên bản 100% */}
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} ({currentExamQuestions[activeQuestionIdx].id})
                              </span>
                              <span className="text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                Mức: {currentExamQuestions[activeQuestionIdx].level} | {currentExamQuestions[activeQuestionIdx].topic}
                              </span>
                            </div>

                            {/* Render nội dung câu chữ và công thức Toán nguyên bản */}
                            <div className="text-sm font-medium text-slate-800 leading-relaxed mb-4">
                              <MathRender content={currentExamQuestions[activeQuestionIdx].content} />
                            </div>

                            {/* Hiển thị đồ thị / bảng biến thiên giữ nguyên vị trí như đề gốc */}
                            {currentExamQuestions[activeQuestionIdx].hasImage && (
                              <div className="my-4 p-4 bg-slate-50 border rounded-xl flex flex-col items-center justify-center">
                                <div className="w-full max-w-sm py-6 bg-white border border-slate-300 rounded-lg flex flex-col items-center justify-center text-xs text-slate-600 shadow-sm">
                                  <span className="text-2xl mb-1">📈</span>
                                  <span className="font-bold">[Đồ thị / Bảng biến thiên nguyên bản của đề gốc]</span>
                                  <span className="font-mono text-[10px] text-blue-600 mt-1">Mã file: {currentExamQuestions[activeQuestionIdx].imageCode}</span>
                                </div>
                              </div>
                            )}

                            {/* 4 Phương án */}
                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <MathRender content={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Mục lục 50 câu */}
                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold text-slate-700 uppercase">Mục lục ({currentExamQuestions.length} câu)</h4>
                          <span className="text-[11px] font-bold text-blue-700 font-mono">
                            {Object.keys(answers).length}/{currentExamQuestions.length}
                          </span>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* KẾT QUẢ BÀI THI */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="text-center pb-4 border-b">
                      <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI TOÁN & XỬ LÝ SỐ LIỆU (50 CÂU NGUYÊN BẢN)</h2>
                      <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số vi phạm rời màn hình: {examFinishedData.violations}</p>
                      
                      <div className="inline-block mt-4 bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                        <span className="text-xs text-blue-700 font-bold uppercase">Tổng Điểm</span>
                        <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                      </div>
                    </div>

                    <button
                      onClick={() => setStudentMode('hub')}
                      className="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs"
                    >
                      Trở về Bảng Điều Khiển Học Viên
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
