<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Thi Đánh Giá Năng Lực (HSA Model)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- KaTeX CSS & JS (Hiển thị công thức Toán học chuẩn xác) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-select { user-select: none; }
    .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Component hiển thị công thức KaTeX
    function MathText({ text }) {
      const elRef = useRef(null);

      useEffect(() => {
        if (elRef.current && window.renderMathInElement) {
          window.renderMathInElement(elRef.current, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        }
      }, [text]);

      return <span ref={elRef} className="inline leading-relaxed whitespace-pre-wrap">{text}</span>;
    }

    const INITIAL_STUDENTS = [
      { id: "07-12A1-001", name: "Nguyễn Văn An", birthYear: "2007", classUnit: "12A1", email: "an.nguyen@example.com", eligible: true, feeStatus: "approved", regTime: "2026-10-15 08:30" },
      { id: "07-12A2-002", name: "Trần Thị Mai", birthYear: "2007", classUnit: "12A2", email: "mai.tran@example.com", eligible: false, feeStatus: "pending", regTime: "2026-10-16 14:15" },
      { id: "07-TP-003", name: "Lê Hoàng Long", birthYear: "2007", classUnit: "TP", email: "long.le@example.com", eligible: false, feeStatus: "unregistered", regTime: "-" }
    ];

    // SINH 50 CÂU TOÁN CHUẨN CẤU TRÚC [MÔN][MÃ ĐỀ]-[THỨ TỰ CÂU] -> T05-01, T05-02,...
    const generate50MathQuestions = () => {
      const qList = [];
      const topics = [
        "Toán học & Xử lý số liệu",
        "Toán học & Xử lý số liệu",
        "Toán học & Xử lý số liệu"
      ];

      for (let i = 1; i <= 50; i++) {
        const numStr = i < 10 ? '0' + i : '' + i;
        const code = `T05-${numStr}`;
        const hasImg = (i % 3 === 1);

        let content = "";
        let opts = [];
        let sol = "";

        if (i % 3 === 1) {
          content = `Cho hàm số bậc ba $y = f(x) = ax^3 + bx^2 + cx + d$ có bảng biến thiên và đồ thị như hình vẽ bên. Tìm tất cả các giá trị thực của tham số $m$ để phương trình $f(x) - 2m = 0$ có đúng 3 nghiệm thực phân biệt.`;
          opts = [
            `$m \in (-2; 2)$`,
            `$m \in [-1; 3]$`,
            `$m < -2$ hoặc $m > 2$`,
            `$m = 0$`
          ];
          sol = `Phương trình tương đương $f(x) = 2m$. Số nghiệm của phương trình là số giao điểm giữa đồ thị $y = f(x)$ và đường thẳng $y = 2m$. Dựa vào đồ thị nguyên bản, yêu cầu tương đương $-4 < 2m < 4 \Leftrightarrow -2 < m < 2$. Chọn đáp án A.`;
        } else if (i % 3 === 2) {
          content = `Tính tích phân $I = \int_{1}^{e} \frac{\ln x}{x\sqrt{1 + \ln x}} dx = \frac{a - b\sqrt{2}}{c}$, với $a, b, c \in \mathbb{Z}$ và phân số tối giản. Tính giá trị $S = a + b + c$.`;
          opts = [
            `$S = 9$`,
            `$S = 12$`,
            `$S = 15$`,
            `$S = 7$`
          ];
          sol = `Đặt $t = \sqrt{1 + \ln x} \Rightarrow t^2 = 1 + \ln x \Rightarrow 2t dt = \frac{dx}{x}$. Đổi cận ta được $I = \frac{4 - 2\sqrt{2}}{3} \Rightarrow a = 4, b = 2, c = 3 \Rightarrow S = 9$.`;
        } else {
          content = `Trong không gian $Oxyz$, cho mặt cầu $(S): (x - 1)^2 + (y + 2)^2 + (z - 3)^2 = 25$ và mặt phẳng $(P): 2x - 2y + z + 4 = 0$. Khoảng cách từ tâm $I$ của $(S)$ đến $(P)$ là:`;
          opts = [
            `$d = \frac{13}{3}$`,
            `$d = 5$`,
            `$d = 3$`,
            `$d = \sqrt{29}$`
          ];
          sol = `Tâm $I(1; -2; 3)$. Áp dụng công thức khoảng cách: $d(I, (P)) = \frac{|2(1) - 2(-2) + 1(3) + 4|}{\sqrt{2^2 + (-2)^2 + 1^2}} = \frac{13}{3}$.`;
        }

        qList.push({
          id: code,
          subject: "Toán",
          topic: "Toán học & Xử lý số liệu",
          level: "VD",
          part: "math",
          content: content,
          hasImage: hasImg,
          imageCode: hasImg ? `${code}.png` : "",
          options: opts,
          correctIndex: 0,
          solution: sol,
          status: "approved"
        });
      }
      return qList;
    };

    // SINH CÂU LUYỆN TẬP PHÁI SINH: CHỈ HIỂN THỊ ĐỀ BÀI THUẦN TÚY (KHÔNG HIỆN ĐỘ KHÓ, KHÔNG HIỆN NGUỒN GỐC, KHÔNG HIỆN CÁCH BIẾN ĐỔI)
    const generatePracticeQuestions = (mathList) => {
      const pList = [];
      mathList.slice(0, 15).forEach((q) => {
        for (let k = 1; k <= 3; k++) {
          let cleanContent = "";
          if (q.content.includes("Cho hàm số bậc ba")) {
            cleanContent = k === 1 
              ? `Cho hàm số bậc ba $y = f(x)$ có bảng biến thiên như hình vẽ bên. Tìm số nghiệm thực của phương trình $2f(x) + 3 = 0$.`
              : (k === 2 
                ? `Cho hàm số $y = f(x)$ có đồ thị như hình vẽ bên. Có bao nhiêu giá trị nguyên của tham số $m \in [-5; 5]$ để phương trình $f(x) = m$ có 3 nghiệm phân biệt?`
                : `Cho hàm số $y = f(x)$ có bảng biến thiên như hình vẽ. Tìm tất cả các giá trị của $m$ để đồ thị hàm số cắt đường thẳng $y = m - 1$ tại đúng một điểm.`);
          } else if (q.content.includes("tích phân")) {
            cleanContent = k === 1
              ? `Biết tích phân $\int_{1}^{e} \frac{1 + \ln x}{x} dx = \frac{a}{b}$ với $a, b \in \mathbb{Z}^+$. Tính $a + b$.`
              : (k === 2
                ? `Cho tích phân $I = \int_{0}^{1} x e^x dx = a + b e$. Mệnh đề nào sau đây đúng?`
                : `Tính tích phân $J = \int_{1}^{2} \frac{2x + 1}{x^2 + x} dx$. Kết quả có dạng $\ln(\frac{a}{b})$. Tìm $a + b$.`);
          } else {
            cleanContent = k === 1
              ? `Trong không gian $Oxyz$, cho điểm $M(2; -1; 3)$ và mặt phẳng $(P): x - 2y + 2z - 1 = 0$. Khoảng cách từ $M$ đến mặt phẳng $(P)$ bằng:`
              : (k === 2
                ? `Trong không gian $Oxyz$, bán kính của mặt cầu $(S): x^2 + y^2 + z^2 - 2x + 4y - 6z + 5 = 0$ bằng:`
                : `Trong không gian $Oxyz$, cho mặt phẳng $(P): 3x - 4z + 1 = 0$. Vectơ nào dưới đây là một vectơ pháp tuyến của $(P)$?`);
          }

          pList.push({
            id: `${q.id}${k}`,
            subject: q.subject,
            part: "math",
            content: cleanContent, // Chỉ chứa đề bài thuần túy
            hasImage: q.hasImage,
            imageCode: q.imageCode,
            options: q.options,
            correctIndex: (q.correctIndex + k) % 4,
            solution: `Lời giải chi tiết cho câu hỏi ${q.id}${k}.`,
            status: "approved"
          });
        }
      });
      return pList;
    };

    const INITIAL_MATH_50 = generate50MathQuestions();
    const INITIAL_PRACTICE = generatePracticeQuestions(INITIAL_MATH_50);

    const INITIAL_EXAMS = [
      { 
        id: "EXAM-2026-01", 
        name: "Đợt 1 - Khảo sát Năng lực HSA Chuẩn 2026", 
        passCode: "HSA2026", 
        startTime: "2026-10-25 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 50,
        active: true 
      },
      { 
        id: "EXAM-2026-02", 
        name: "Đợt 2 - Thi Thử Năng Lực Toán & Xử Lý Số Liệu", 
        passCode: "HSA2026D2", 
        startTime: "2026-11-10 08:00", 
        fee: "50.000 VNĐ",
        totalQuestions: 50,
        active: true 
      }
    ];

    function App() {
      const [view, setView] = useState('student'); // 'student' hoặc 'admin'
      const [adminTab, setAdminTab] = useState('root_bank'); // 'root_bank', 'practice_bank', 'exam_creator', 'import_exact', 'students'
      const [currentUserIndex, setCurrentUserIndex] = useState(0);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [exams, setExams] = useState(INITIAL_EXAMS);
      
      // Ngân hàng câu hỏi
      const [rootQuestions, setRootQuestions] = useState(INITIAL_MATH_50);
      const [practiceQuestions, setPracticeQuestions] = useState(INITIAL_PRACTICE);

      // Modal chỉnh sửa câu hỏi
      const [editingModalOpen, setEditingModalOpen] = useState(false);
      const [currentEditQuestion, setCurrentEditQuestion] = useState(null);

      // Thẩm định & nạp câu hỏi mới
      const [newSubjectCode, setNewSubjectCode] = useState("T");
      const [newExamCode, setNewExamCode] = useState("05");
      const [newOrderNum, setNewOrderNum] = useState("03");
      const [newContent, setNewContent] = useState("");
      const [newOptA, setNewOptA] = useState("");
      const [newOptB, setNewOptB] = useState("");
      const [newOptC, setNewOptC] = useState("");
      const [newOptD, setNewOptD] = useState("");
      const [newSolution, setNewSolution] = useState("");
      const [newHasImage, setNewHasImage] = useState(false);
      const [newImageCode, setNewImageCode] = useState("");

      // Quản lý tạo đợt thi
      const [createdExamName, setCreatedExamName] = useState("Đợt thi Khảo sát HSA Tháng 11");
      const [createdExamPasscode, setCreatedExamPasscode] = useState("HSA2026");
      const [createdExamFee, setCreatedExamFee] = useState("50.000 VNĐ");
      const [createdExamTime, setCreatedExamTime] = useState("2026-11-15T08:00");

      // Phòng thi
      const [studentMode, setStudentMode] = useState('hub');
      const [examPasscode, setExamPasscode] = useState('');
      const [currentExamQuestions, setCurrentExamQuestions] = useState([]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(75 * 60);
      const [examViolationCount, setExamViolationCount] = useState(0);
      const [examFinishedData, setExamFinishedData] = useState(null);

      // Modal nộp phí
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [paymentRefCode, setPaymentRefCode] = useState("");

      const currentUser = students[currentUserIndex];

      // Đếm ngược thời gian thi
      useEffect(() => {
        let timer = null;
        if ((studentMode === 'exam' || studentMode === 'practice') && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => {
              if (prev <= 1) {
                handleSubmitExam();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [studentMode, timeLeft]);

      // Chống chuyển tab
      useEffect(() => {
        if (studentMode !== 'exam') return;
        const handleVisibilityChange = () => {
          if (document.hidden) {
            setExamViolationCount(c => {
              const next = c + 1;
              if (next >= 3) {
                alert("CẢNH BÁO VI PHẠM: Bạn rời màn hình thi quá 3 lần! Bài thi tự động thu.");
                handleSubmitExam();
              }
              return next;
            });
          }
        };
        const handleBlur = () => setExamViolationCount(c => c + 1);
        document.addEventListener("visibilitychange", handleVisibilityChange);
        window.addEventListener("blur", handleBlur);
        return () => {
          document.removeEventListener("visibilitychange", handleVisibilityChange);
          window.removeEventListener("blur", handleBlur);
        };
      }, [studentMode]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      };

      // XÓA ĐỢT THI
      const handleDeleteExam = (examId, examName) => {
        if (window.confirm(`Bạn có chắc chắn muốn xóa đợt thi "${examName}" (Mã: ${examId}) không?`)) {
          setExams(exams.filter(ex => ex.id !== examId));
          alert(`Đã xóa thành công đợt thi ${examName}!`);
        }
      };

      // TẠO ĐỢT THI MỚI
      const handleCreateExam = () => {
        if (!createdExamName.trim() || !createdExamPasscode.trim()) {
          alert("Vui lòng điền đầy đủ tên đợt thi và mật khẩu!");
          return;
        }
        const newExam = {
          id: `EXAM-${Date.now().toString().slice(-4)}`,
          name: createdExamName,
          passCode: createdExamPasscode,
          startTime: createdExamTime.replace("T", " "),
          fee: createdExamFee,
          totalQuestions: 50,
          active: true
        };
        setExams([newExam, ...exams]);
        alert(`TẠO ĐỢT THI THÀNH CÔNG!
- Đợt: ${newExam.name}
- Mật khẩu: ${newExam.passCode}
- Tự động bốc ĐỦ 50 câu Toán từ Ngân hàng Đề Gốc.`);
      };

      // MỞ MODAL CHỈNH SỬA
      const handleOpenEditModal = (question) => {
        setCurrentEditQuestion({ ...question, options: [...question.options] });
        setEditingModalOpen(true);
      };

      // LƯU CÂU HỎI SAU CHỈNH SỬA
      const handleSaveQuestionChanges = () => {
        if (!currentEditQuestion) return;

        setRootQuestions(rootQuestions.map(q => q.id === currentEditQuestion.id ? currentEditQuestion : q));
        setEditingModalOpen(false);
        alert(`Đã cập nhật câu hỏi ${currentEditQuestion.id} thành công!`);
      };

      // THÊM CÂU HỎI MỚI THEO CẤU TRÚC [MÔN][MÃ ĐỀ]-[THỨ TỰ CÂU]
      const handleAddNewExactQuestion = () => {
        if (!newContent.trim()) {
          alert("Vui lòng nhập nội dung câu hỏi!");
          return;
        }

        const formattedId = `${newSubjectCode}${newExamCode}-${newOrderNum}`; // Ví dụ: T05-03
        const finalImageCode = newHasImage ? (newImageCode || `${formattedId}.png`) : "";

        const newQ = {
          id: formattedId,
          subject: newSubjectCode === "T" ? "Toán" : (newSubjectCode === "V" ? "Văn" : "Lý"),
          topic: "Toán học & Xử lý số liệu",
          level: "VD",
          part: "math",
          content: newContent,
          hasImage: newHasImage,
          imageCode: finalImageCode,
          options: [
            newOptA || "Phương án A",
            newOptB || "Phương án B",
            newOptC || "Phương án C",
            newOptD || "Phương án D"
          ],
          correctIndex: 0,
          solution: newSolution || "Lời giải chuẩn xác 100%.",
          status: "approved"
        };

        // 3 câu phái sinh luyện tập: Chỉ chứa đề bài thuần túy (không chứa nhãn phái sinh/cách biến đổi)
        const v1 = {
          id: `${formattedId}1`,
          subject: newQ.subject,
          part: "math",
          content: `${newContent} (Biến thể số liệu 1)`,
          hasImage: newHasImage,
          imageCode: finalImageCode,
          options: newQ.options,
          correctIndex: 1,
          solution: `Lời giải câu hỏi ${formattedId}1.`,
          status: "approved"
        };
        const v2 = { ...v1, id: `${formattedId}2`, content: `${newContent} (Biến thể số liệu 2)` };
        const v3 = { ...v1, id: `${formattedId}3`, content: `${newContent} (Biến thể số liệu 3)` };

        setRootQuestions([newQ, ...rootQuestions]);
        setPracticeQuestions([v1, v2, v3, ...practiceQuestions]);

        alert(`ĐÃ CHUYỂN NGUYÊN VẸN CÂU HỎI VÀO NGÂN HÀNG ĐỀ GỐC!
- Mã định danh: ${formattedId}
- Ảnh đồ thị: ${finalImageCode || 'Không có'}
- Đã nạp đề bài vào Ngân hàng Đề Gốc và Ngân hàng Luyện Tập.`);
        
        setNewContent("");
        setNewOptA("");
        setNewOptB("");
        setNewOptC("");
        setNewOptD("");
        setNewSolution("");
        setNewHasImage(false);
        setNewImageCode("");
      };

      // BẮT ĐẦU THI
      const handleStartExam = () => {
        if (currentUser.feeStatus !== 'approved' || !currentUser.eligible) {
          alert("BẠN CHƯA ĐỦ ĐIỀU KIỆN DỰ THI! Vui lòng nộp lệ phí và chờ Quản trị viên phê duyệt.");
          return;
        }
        if (examPasscode.trim() !== exams[0].passCode) {
          alert(`Mật khẩu đợt thi không chính xác! (Mật khẩu: ${exams[0].passCode})`);
          return;
        }

        const full50 = rootQuestions.filter(q => q.subject === "Toán").slice(0, 50);
        setCurrentExamQuestions(full50);
        setAnswers({});
        setTimeLeft(75 * 60);
        setExamViolationCount(0);
        setActiveQuestionIdx(0);
        setStudentMode('exam');
      };

      const handleSubmitExam = () => {
        let total = 0;
        currentExamQuestions.forEach((q, idx) => {
          if (answers[idx] === q.correctIndex) total += 1;
        });

        setExamFinishedData({
          total: total,
          questions: currentExamQuestions,
          userAnswers: answers,
          violations: examViolationCount
        });
        setStudentMode('result');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          {/* HEADER */}
          <header className="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-400 text-blue-950 flex items-center justify-center font-black text-xl shadow">
                  HSA
                </div>
                <div>
                  <h1 className="font-bold text-lg md:text-xl tracking-tight leading-none">HỆ THỐNG LUYỆN THI ĐÁNH GIÁ NĂNG LỰC</h1>
                  <span className="text-xs text-blue-200">Chuẩn Khung HSA • Khảo Thí & Thẩm Định Độc Lập</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="hidden md:flex items-center bg-blue-950/70 px-2 py-1 rounded text-xs">
                  <span className="text-slate-300 mr-2">Đang đóng vai:</span>
                  <select 
                    value={currentUserIndex} 
                    onChange={(e) => setCurrentUserIndex(Number(e.target.value))}
                    className="bg-transparent text-amber-300 font-bold outline-none cursor-pointer"
                  >
                    {students.map((st, i) => (
                      <option key={st.id} value={i} className="text-slate-900">
                        {st.name} ({st.id} - {st.feeStatus === 'approved' ? 'Đã duyệt' : st.feeStatus === 'pending' ? 'Chờ duyệt' : 'Chưa nộp'})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="flex bg-blue-950/80 p-1 rounded-lg border border-blue-700/50">
                  <button
                    onClick={() => { setView('student'); setStudentMode('hub'); }}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'student' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Học Viên
                  </button>
                  <button
                    onClick={() => setView('admin')}
                    className={`px-3 py-1.5 text-xs md:text-sm font-semibold rounded transition ${view === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'text-blue-200 hover:text-white'}`}
                  >
                    Phòng Quản Trị
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {view === 'admin' ? (
              /* ==================== PHÒNG QUẢN TRỊ ==================== */
              <div className="space-y-6">
                {/* THANH MENU QUẢN TRỊ */}

                              />
                            </div>
                          )}
                        </div>

                        {/* 4 Phương án */}
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" placeholder="Phương án A ($...$)" value={newOptA} onChange={(e) => setNewOptA(e.target.value)} className="border rounded-lg p-2 font-mono" />
                          <input type="text" placeholder="Phương án B ($...$)" value={newOptB} onChange={(e) => setNewOptB(e.target.value)} className="border rounded-lg p-2 font-mono" />
                          <input type="text" placeholder="Phương án C ($...$)" value={newOptC} onChange={(e) => setNewOptC(e.target.value)} className="border rounded-lg p-2 font-mono" />
                          <input type="text" placeholder="Phương án D ($...$)" value={newOptD} onChange={(e) => setNewOptD(e.target.value)} className="border rounded-lg p-2 font-mono" />
                        </div>

                        <div>
                          <label className="block font-semibold mb-1">Lời giải chi tiết:</label>
                          <textarea
                            rows="2"
                            value={newSolution}
                            onChange={(e) => setNewSolution(e.target.value)}
                            placeholder="Lời giải tối ưu chuẩn xác 100%..."
                            className="w-full border rounded-xl p-2 font-mono"
                          ></textarea>
                        </div>

                        <button
                          onClick={handleAddNewExactQuestion}
                          className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                        >
                          Xác Nhận Thẩm Định & Nạp Đúng 100% Vào Ngân Hàng
                        </button>
                      </div>

                      {/* Live preview */}
                      <div className="bg-slate-50 border border-dashed rounded-2xl p-4 flex flex-col justify-between text-xs">
                        <div>
                          <span className="font-bold text-slate-700 uppercase block mb-3">Xem trước đề bài hiển thị chuẩn KaTeX:</span>
                          {newContent ? (
                            <div className="bg-white p-4 rounded-xl border space-y-3">
                              <span className="font-mono font-bold text-blue-900 bg-amber-300 px-2 py-0.5 rounded text-xs">
                                {newSubjectCode}{newExamCode}-{newOrderNum}
                              </span>
                              <div className="font-medium text-slate-900 leading-relaxed">
                                <MathText text={newContent} />
                              </div>
                              {newHasImage && (
                                <div className="p-3 bg-indigo-50 border border-dashed border-indigo-200 rounded text-center">
                                  [Hình vẽ/Đồ thị: {newImageCode || `${newSubjectCode}${newExamCode}-${newOrderNum}.png`}]
                                </div>
                              )}
                              <div className="grid grid-cols-2 gap-2">
                                <div className="p-2 border rounded"><MathText text={`A. ${newOptA || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathText text={`B. ${newOptB || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathText text={`C. ${newOptC || '...'}`} /></div>
                                <div className="p-2 border rounded"><MathText text={`D. ${newOptD || '...'}`} /></div>
                              </div>
                            </div>
                          ) : (
                            <div className="h-64 flex items-center justify-center text-slate-400 text-center">
                              Chưa có nội dung xem trước.
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 5. PHÊ DUYỆT LỆ PHÍ */}
                {adminTab === 'students' && (
                  <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h2 className="text-lg font-bold text-blue-950">Phê Duyệt Lệ Phí & Bật Quyền Dự Thi</h2>
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-600 border-b">
                        <tr>
                          <th className="py-2.5 px-3">Mã ID</th>
                          <th className="py-2.5 px-3">Họ Tên</th>
                          <th className="py-2.5 px-3">Lớp</th>
                          <th className="py-2.5 px-3 text-center">Lệ phí</th>
                          <th className="py-2.5 px-3 text-center">Điều kiện thi</th>
                          <th className="py-2.5 px-3 text-right">Thao tác</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-slate-700">
                        {students.map((st) => (
                          <tr key={st.id} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-mono font-bold text-blue-900">{st.id}</td>
                            <td className="py-2.5 px-3 font-semibold">{st.name}</td>
                            <td className="py-2.5 px-3">{st.classUnit}</td>
                            <td className="py-2.5 px-3 text-center">
                              {st.feeStatus === 'approved' && <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">ĐÃ NỘP</span>}
                              {st.feeStatus === 'pending' && <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold animate-pulse">CHỜ DUYỆT</span>}
                              {st.feeStatus === 'unregistered' && <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded">CHƯA NỘP</span>}
                            </td>
                            <td className="py-2.5 px-3 text-center">
                              <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${st.eligible ? 'bg-emerald-500 text-white' : 'bg-rose-100 text-rose-800'}`}>
                                {st.eligible ? "✓ ĐỦ ĐIỀU KIỆN" : "✗ KHÓA"}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-right">
                              {st.feeStatus === 'pending' ? (
                                <button
                                  onClick={() => setStudents(students.map(s => s.id === st.id ? { ...s, eligible: true, feeStatus: 'approved' } : s))}
                                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-xs"
                                >
                                  Duyệt Phí & Mở Quyền Thi
                                </button>
                              ) : (
                                <button
                                  onClick={() => setStudents(students.map(s => s.id === st.id ? { ...s, eligible: !s.eligible } : s))}
                                  className="text-blue-600 hover:text-blue-900 font-semibold"
                                >
                                  {st.eligible ? "Tắt quyền thi" : "Bật quyền thi"}
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            ) : (
              /* ==================== PHÒNG HỌC VIÊN ==================== */
              <div>
                {studentMode === 'hub' && (
                  <div className="space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h2 className="text-lg font-bold text-slate-900">{currentUser.name}</h2>
                          <span className="bg-blue-100 text-blue-900 font-mono font-bold text-xs px-2.5 py-0.5 rounded-full">{currentUser.id}</span>
                          <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Lớp: {currentUser.classUnit}</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-1">Đợt thi hiện tại: <strong>{exams[0]?.name || "Chưa có đợt thi"}</strong></p>
                      </div>

                      <div className="flex items-center gap-3">
                        {currentUser.feeStatus === 'approved' && currentUser.eligible ? (
                          <div className="flex items-center gap-2 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                            <span className="text-xs font-bold text-emerald-800">ĐÃ DUYỆT: ĐỦ ĐIỀU KIỆN DỰ THI</span>
                          </div>
                        ) : currentUser.feeStatus === 'pending' ? (
                          <div className="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl">
                            <span className="text-xs font-bold text-amber-800">⏳ ĐÃ NỘP PHÍ - CHỜ DUYỆT</span>
                          </div>
                        ) : (
                          <button
                            onClick={() => {
                              setPaymentRefCode(`HSA-${currentUser.id}-99`);
                              setShowPaymentModal(true);
                            }}
                            className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow"
                          >
                            💳 Đăng Ký Thi & Nộp Phí ({exams[0]?.fee || "50.000 VNĐ"})
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-indigo-50 text-indigo-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">📖</div>
                          <h3 className="text-base font-bold text-slate-900 mb-1">Phòng Luyện Tập Theo Chuyên Đề</h3>
                          <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                            Mở tự do. Ôn luyện câu hỏi luyện tập hiển thị đề bài thuần túy, công thức toán sắc nét và hướng dẫn giải chi tiết.
                          </p>
                        </div>
                        <button
                          onClick={() => {
                            setCurrentExamQuestions(practiceQuestions.slice(0, 30));
                            setAnswers({});
                            setTimeLeft(45 * 60);
                            setActiveQuestionIdx(0);
                            setStudentMode('practice');
                          }}
                          className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs"
                        >
                          Vào Luyện Tập Tự Do (30 câu)
                        </button>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border-2 border-blue-600/30 shadow-sm flex flex-col justify-between">
                        <div>
                          <div className="w-12 h-12 bg-blue-50 text-blue-700 rounded-xl flex items-center justify-center font-black text-2xl mb-4">🎓</div>
                          <h3 className="text-base font-bold text-slate-900">Phòng Thi Chính Thức ({exams[0]?.name || "Đợt thi"})</h3>
                          <p className="text-xs text-slate-500 mt-1 mb-3">
                            Lấy đúng 50 câu Toán chuẩn cấu trúc mã định danh (T05-01 đến T05-50). Hiển thị công thức KaTeX sắc nét và đồ thị nguyên vẹn.
                          </p>

                          <div className="space-y-2 bg-slate-50 p-3 rounded-xl border mb-4">
                            <label className="block text-[11px] font-bold text-slate-600 uppercase">Mật khẩu đợt thi:</label>
                            <input
                              type="password"
                              placeholder={`Nhập ${exams[0]?.passCode || "HSA2026"}...`}
                              value={examPasscode}
                              onChange={(e) => setExamPasscode(e.target.value)}
                              className="w-full border rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-blue-500"
                            />
                          </div>
                        </div>

                        <button
                          onClick={handleStartExam}
                          className={`w-full py-2.5 rounded-xl font-bold text-xs transition shadow ${currentUser.eligible && currentUser.feeStatus === 'approved' ? 'bg-blue-700 hover:bg-blue-800 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                        >
                          {currentUser.eligible && currentUser.feeStatus === 'approved' ? "Bắt Đầu Thi (Lấy Đủ 50 Câu Toán)" : "Chưa đủ điều kiện (Cần nộp phí & duyệt)"}
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODAL NỘP PHÍ */}
                {showPaymentModal && (
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
                      <div className="flex justify-between items-center border-b pb-3">
                        <h3 className="font-bold text-base text-slate-900">Đăng Ký Dự Thi & Nộp Lệ Phí</h3>
                        <button onClick={() => setShowPaymentModal(false)} className="text-slate-400 font-bold">✕</button>
                      </div>
                      <div className="text-xs space-y-1 text-slate-600">
                        <p>Thí sinh: <strong>{currentUser.name}</strong> ({currentUser.id})</p>
                        <p>Lệ phí hỗ trợ thẩm định đề: <strong className="text-rose-600 font-bold">{exams[0]?.fee || "50.000 VNĐ"}</strong></p>
                      </div>
                      <div className="bg-slate-50 border rounded-xl p-4 text-center">
                        <div className="w-32 h-32 bg-white border-2 border-slate-300 rounded mx-auto flex items-center justify-center font-black text-xl">
                          VIETQR
                        </div>
                        <p className="text-[11px] text-slate-500 mt-2 font-mono">Mã CK: <strong>{paymentRefCode}</strong></p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setShowPaymentModal(false)} className="flex-1 py-2 border rounded-xl text-xs font-semibold">Hủy</button>
                        <button
                          onClick={() => {
                            setStudents(students.map(s => s.id === currentUser.id ? { ...s, feeStatus: 'pending', regTime: new Date().toLocaleString('vi-VN') } : s));
                            setShowPaymentModal(false);
                            alert("Đã gửi xác nhận nộp phí! Vui lòng chờ Quản trị viên duyệt.");
                          }}
                          className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow"
                        >
                          Xác Nhận Đã Chuyển Tiền
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* MÀN HÌNH LÀM BÀI ĐỦ 50 CÂU */}
                {(studentMode === 'exam' || studentMode === 'practice') && (
                  <div className="space-y-4 no-select">
                    {studentMode === 'exam' && examViolationCount > 0 && (
                      <div className="bg-rose-50 border-l-4 border-rose-500 p-3 rounded-lg text-rose-800 text-xs flex justify-between items-center">
                        <span className="font-bold">⚠️ RỜI MÀN HÌNH {examViolationCount}/3 LẦN! (Quá 3 lần sẽ tự động thu bài).</span>
                        <span className="font-mono font-bold bg-rose-200 px-2 py-0.5 rounded">Vi phạm: {examViolationCount}</span>
                      </div>
                    )}

                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-blue-900 bg-blue-100 px-2.5 py-1 rounded-full">
                          {studentMode === 'exam' ? `ĐỢT THI CHÍNH THỨC (${currentExamQuestions.length} CÂU NGUYÊN BẢN)` : `BÀI LUYỆN TẬP (${currentExamQuestions.length} CÂU)`}
                        </span>
                        <h2 className="text-sm font-bold text-slate-800 mt-1">Phần 1: Toán học & Xử lý số liệu</h2>
                      </div>

                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <span className="text-[10px] text-slate-500 block uppercase font-bold">Thời gian làm bài</span>
                          <span className="font-mono text-xl font-black text-rose-600">{formatTime(timeLeft)}</span>
                        </div>
                        <button
                          onClick={handleSubmitExam}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow"
                        >
                          Nộp Bài Thi
                        </button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                      {/* Cột hiển thị câu hỏi chi tiết */}
                      <div className="lg:col-span-3 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        {currentExamQuestions.length > 0 && (
                          <div>
                            <div className="flex justify-between items-center border-b pb-3 mb-4">
                              <span className="font-bold text-xs text-blue-900">
                                Câu {activeQuestionIdx + 1} / {currentExamQuestions.length} (Mã: {currentExamQuestions[activeQuestionIdx].id})
                              </span>
                            </div>

                            {/* Render KaTeX công thức toán */}
                            <div className="text-sm font-medium text-slate-900 leading-relaxed mb-4">
                              <MathText text={currentExamQuestions[activeQuestionIdx].content} />
                            </div>

                            {/* Hiển thị đồ thị / bảng biến thiên */}
                            {currentExamQuestions[activeQuestionIdx].hasImage && (
                              <div className="my-4 p-4 bg-slate-50 border rounded-xl flex flex-col items-center justify-center">
                                <div className="w-full max-w-sm py-6 bg-white border border-slate-300 rounded-lg flex flex-col items-center justify-center text-xs text-slate-600 shadow-sm">
                                  <span className="text-2xl mb-1">📈</span>
                                  <span className="font-bold">[Đồ thị / Bảng biến thiên nguyên bản]</span>
                                  <span className="font-mono text-[11px] text-blue-600 mt-1 font-bold">Mã file: {currentExamQuestions[activeQuestionIdx].imageCode}</span>
                                </div>
                              </div>
                            )}

                            {/* 4 Phương án */}
                            <div className="space-y-2 mt-4">
                              {currentExamQuestions[activeQuestionIdx].options.map((opt, oIdx) => {
                                const isSelected = answers[activeQuestionIdx] === oIdx;
                                return (
                                  <button
                                    key={oIdx}
                                    onClick={() => setAnswers({ ...answers, [activeQuestionIdx]: oIdx })}
                                    className={`w-full text-left p-3 rounded-xl border text-xs md:text-sm font-medium flex items-center space-x-3 transition ${isSelected ? 'bg-blue-50 border-blue-600 text-blue-950 font-bold' : 'hover:bg-slate-50 border-slate-200'}`}
                                  >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                      {String.fromCharCode(65 + oIdx)}
                                    </span>
                                    <div className="flex-1">
                                      <MathText text={opt} />
                                    </div>
                                  </button>
                                );
                              })}
                            </div>

                            <div className="flex justify-between mt-6 pt-4 border-t">
                              <button
                                disabled={activeQuestionIdx === 0}
                                onClick={() => setActiveQuestionIdx(i => i - 1)}
                                className="px-3 py-1.5 border rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                ← Câu trước
                              </button>
                              <button
                                disabled={activeQuestionIdx === currentExamQuestions.length - 1}
                                onClick={() => setActiveQuestionIdx(i => i + 1)}
                                className="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold disabled:opacity-30"
                              >
                                Câu kế tiếp →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>

                      {/* Mục lục 50 câu */}
                      <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm h-fit">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold text-slate-700 uppercase">Mục lục ({currentExamQuestions.length} câu)</h4>
                          <span className="text-[11px] font-bold text-blue-700 font-mono">
                            {Object.keys(answers).length}/{currentExamQuestions.length}
                          </span>
                        </div>
                        <div className="grid grid-cols-5 gap-1.5 max-h-[400px] overflow-y-auto pr-1">
                          {currentExamQuestions.map((_, idx) => {
                            const isAnswered = answers[idx] !== undefined;
                            const isCurrent = activeQuestionIdx === idx;
                            return (
                              <button
                                key={idx}
                                onClick={() => setActiveQuestionIdx(idx)}
                                className={`h-8 rounded text-xs font-bold transition ${isCurrent ? 'ring-2 ring-blue-600' : ''} ${isAnswered ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                              >
                                {idx + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* KẾT QUẢ BÀI THI */}
                {studentMode === 'result' && examFinishedData && (
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div className="text-center pb-4 border-b">
                      <h2 className="text-xl font-bold text-slate-900">KẾT QUẢ BÀI THI TOÁN & XỬ LÝ SỐ LIỆU (50 CÂU NGUYÊN BẢN)</h2>
                      <p className="text-xs text-slate-500">Mã thí sinh: {currentUser.id} | Số vi phạm rời màn hình: {examFinishedData.violations}</p>
                      
                      <div className="inline-block mt-4 bg-blue-50 border border-blue-200 px-6 py-3 rounded-2xl">
                        <span className="text-xs text-blue-700 font-bold uppercase">Điểm Số Đạt Được</span>
                        <div className="text-3xl font-black text-blue-950">{examFinishedData.total} / {examFinishedData.questions.length}</div>
                      </div>
                    </div>

                    <button
                      onClick={() => setStudentMode('hub')}
                      className="w-full py-2.5 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl text-xs"
                    >
                      Trở về Bảng Điều Khiển Học Viên
                    </button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
